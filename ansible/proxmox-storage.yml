        h.stage.path.startswith(m.target.rstrip(''/'') ~ ''/'') %}{% if n.mount is none or m.target | length > n.mount.target
        | length %}{% set n.mount=m %}{% endif %}{% endif %}{% endfor %}{{ {''device'':n.mount[''maj:min''], ''root'':(n.mount.fsroot.rstrip(''/'')
        ~ ''/'' ~ h.stage.path[n.mount.target | length:].lstrip(''/'')).rstrip(''/'') or ''/'', ''anchor'':n.mount.target,
