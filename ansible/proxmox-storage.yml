# R1/R2 only; exact live guards; no copy/cutover/final enable/swap/foreign interruption.
- name: Converge native Proxmox root and protected temporary image stage only
  hosts: proxmox_hypervisors
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    h: '{{ {''apply'': false, ''root'': {''enabled'': false}, ''stage'': {''enabled'': false}} | combine(qcl_host_storage
      | default({}), recursive=true) }}'
  tasks:
  - name: Strict disabled-by-default host intent
    ansible.builtin.assert:
      that:
      - h.apply is boolean
      - h.root.enabled is boolean
      - h.stage.enabled is boolean
      - not (h.root.enabled or h.stage.enabled) or h.apply
      - not (h.root.enabled or h.stage.enabled) or not ansible_check_mode
      fail_msg: 'Host storage refusal: missing, stale, ambiguous or out-of-envelope evidence; preserve original
        receipt and partial state.'
  - name: Require fresh owning admission and distinct retained recovery receipts
    ansible.builtin.assert:
      that:
      - h.admission.fresh is sameas true
      - h.admission.exclusive is sameas true
      - h.admission.receipt | length > 0
      - h.attempt_id | length > 0
      - h.original_receipt | length > 0
      - h.attempt_id != h.original_receipt
      fail_msg: 'Host storage refusal: missing, stale, ambiguous or out-of-envelope evidence; preserve original
        receipt and partial state.'
    when: h.root.enabled or h.stage.enabled
  - name: Constrain measured executable paths
    ansible.builtin.assert:
      that:
      - h.tools.lvs is match("^/(usr/)?sbin/lvs$")
      - h.tools.vgs is match("^/(usr/)?sbin/vgs$")
      - h.tools.pvs is match("^/(usr/)?sbin/pvs$")
      - h.tools.blkid is match("^/(usr/)?sbin/blkid$")
      - h.tools.wipefs is match("^/(usr/)?sbin/wipefs$")
      - h.tools.dumpe2fs is match("^/(usr/)?sbin/dumpe2fs$")
      - h.tools.resize2fs is match("^/(usr/)?sbin/resize2fs$")
      - h.tools.blockdev is match("^/(usr/)?(sbin|bin)/blockdev$")
      fail_msg: 'Host storage refusal: missing, stale, ambiguous or out-of-envelope evidence; preserve original
        receipt and partial state.'
    when: h.root.enabled or h.stage.enabled
  - name: Read native time for admission expiry
    ansible.builtin.command:
      argv:
      - /usr/bin/date
      - +%s
    register: admission_clock
    changed_when: false
    check_mode: false
    when: h.root.enabled or h.stage.enabled
    environment:
      LC_ALL: C
  - name: Refuse expired private admission
    ansible.builtin.assert:
      that:
      - h.admission.expires_at_epoch is integer
      - h.admission.expires_at_epoch is not boolean
      - h.admission.expires_at_epoch > (admission_clock.stdout | trim | int)
    when: h.root.enabled or h.stage.enabled
  - name: Fresh host identity
    ansible.builtin.command:
      argv:
      - /usr/bin/cat
      - /etc/machine-id
    register: host_probe
    changed_when: false
    check_mode: false
    when: h.root.enabled or h.stage.enabled
    environment:
      LC_ALL: C
  - name: Fresh boot identity
    ansible.builtin.command:
      argv:
      - /usr/bin/cat
      - /proc/sys/kernel/random/boot_id
    register: boot_probe
    changed_when: false
    check_mode: false
    when: h.root.enabled or h.stage.enabled
    environment:
      LC_ALL: C
  - name: Match exact admitted host and boot
    ansible.builtin.assert:
      that:
      - host_probe.stdout | trim == h.host_id
      - boot_probe.stdout | trim == h.boot_id
      fail_msg: 'Host storage refusal: missing, stale, ambiguous or out-of-envelope evidence; preserve original
        receipt and partial state.'
    when: h.root.enabled or h.stage.enabled
  - name: Capture all existing LV identities
    ansible.builtin.command:
      argv:
      - '{{ h.tools.lvs }}'
      - --reportformat
      - json
      - --units
      - b
      - --nosuffix
      - --options
      - lv_name,vg_name,lv_uuid,vg_uuid,lv_size,segtype,pool_lv,lv_path,data_percent,metadata_percent,lv_metadata_size,devices,lv_attr,lv_health_status
    register: lv_probe
    changed_when: false
    check_mode: false
    when: h.root.enabled or h.stage.enabled
    environment:
      LC_ALL: C
  - name: Capture actual mount topology
    ansible.builtin.command:
      argv:
      - /usr/bin/findmnt
      - --json
      - --list
      - --output
      - TARGET,SOURCE,UUID,FSTYPE,FSROOT,MAJ:MIN
    register: mount_probe
    changed_when: false
    check_mode: false
    when: h.root.enabled or h.stage.enabled
    environment:
      LC_ALL: C
  - name: Decode native LV and mount reports
    ansible.builtin.set_fact:
      initial_lvs: '{{ (lv_probe.stdout | from_json).report[0].lv }}'
      mounts: '{{ (mount_probe.stdout | from_json).filesystems }}'
    when: h.root.enabled or h.stage.enabled
  - name: Validate canonical nonzero distinct fixed stage UUID before creation
    ansible.builtin.assert:
      that:
      - h.stage.fs_uuid is string
      - h.stage.fs_uuid is match("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")
      - h.stage.fs_uuid != "00000000-0000-0000-0000-000000000000"
      - mounts | selectattr("target", "equalto", "/") | list | length == 1
      - h.stage.fs_uuid != (mounts | selectattr("target", "equalto", "/") | list)[0].uuid
      fail_msg: 'Host storage refusal: inconsistent identity, relevant alias, changed loaded unit or unsafe reserve;
        preserve attempt.'
    when: h.stage.enabled
  - name: Fresh outside-pool VG ledger
    ansible.builtin.command:
      argv:
      - '{{ h.tools.vgs }}'
      - --reportformat
      - json
      - --units
      - b
      - --nosuffix
      - --options
      - vg_name,vg_uuid,vg_free,vg_extent_size
    register: vg_probe
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Fresh PV membership
    ansible.builtin.command:
      argv:
      - '{{ h.tools.pvs }}'
      - --reportformat
      - json
      - --options
      - pv_name,pv_uuid,vg_uuid
    register: pv_probe
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Select exact root LV VG and mounted root
    ansible.builtin.set_fact:
      root_rows: '{{ initial_lvs | selectattr("lv_name", "equalto", h.root.lv) | selectattr("vg_name", "equalto",
        h.root.vg) | list }}'
      root_vgs: '{{ (vg_probe.stdout | from_json).report[0].vg | selectattr("vg_name", "equalto", h.root.vg) | list
        }}'
      root_mounts: '{{ mounts | selectattr("target", "equalto", "/") | list }}'
      root_pvs: '{{ (pv_probe.stdout | from_json).report[0].pv | selectattr("pv_uuid", "equalto", h.root.pv_uuid)
        | list }}'
    when: h.root.enabled
  - name: Existing root must resolve to exactly one PV VG LV and mount
    ansible.builtin.assert:
      that:
      - root_rows | length > 0
      - root_vgs | length == 1
      - root_mounts | length == 1
      - root_pvs | length == 1
      fail_msg: 'Host storage refusal: missing, stale, ambiguous or out-of-envelope evidence; preserve original
        receipt and partial state.'
    when: h.root.enabled
  - name: Resolve expected existing root device
    ansible.builtin.command:
      argv:
      - /usr/bin/realpath
      - -e
      - '{{ h.root.device }}'
    register: root_device_real
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Resolve actual mounted root block device
    ansible.builtin.command:
      argv:
      - /usr/bin/realpath
      - -e
      - '{{ root_mounts[0].source }}'
    register: root_mount_real
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Match existing root identities and resolved device
    ansible.builtin.assert:
      that:
      - root_rows | length > 0
      - root_rows | map(attribute="lv_uuid") | unique | list == [h.root.lv_uuid]
      - root_rows | map(attribute="vg_uuid") | unique | list == [h.root.vg_uuid]
      - root_rows | map(attribute="lv_name") | unique | list == [h.root.lv]
      - root_rows | map(attribute="vg_name") | unique | list == [h.root.vg]
      - root_rows | map(attribute="lv_path") | unique | list == [h.root.device]
      - root_rows | map(attribute="lv_size") | unique | length == 1
      - root_rows | map(attribute="segtype") | unique | list == ["linear"]
      - root_rows | selectattr("devices", "match", "^" ~ (root_pvs[0].pv_name | regex_escape) ~ "\\([0-9]+\\)$")
        | list | length == root_rows | length
      - root_vgs[0].vg_uuid == h.root.vg_uuid
      - root_pvs[0].vg_uuid == h.root.vg_uuid
      - root_mounts[0].uuid == h.root.fs_uuid
      - root_mounts[0].fstype == "ext4"
      - root_mounts[0].fsroot == "/"
      - root_device_real.stdout | trim == root_mount_real.stdout | trim
    when: h.root.enabled
  - name: Read existing ext4 superblock
    ansible.builtin.command:
      argv:
      - '{{ h.tools.dumpe2fs }}'
      - -h
      - '{{ h.root.device }}'
    register: fs_probe
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Decode independent existing ext4 geometry
    ansible.builtin.set_fact:
      fs_blocks: '{{ (fs_probe.stdout | regex_findall("(?m)^Block count: +([0-9]+)$"))[0] | int }}'
      fs_block_size: '{{ (fs_probe.stdout | regex_findall("(?m)^Block size: +([0-9]+)$"))[0] | int }}'
      root_lv_bytes: '{{ root_rows[0].lv_size | trim | int }}'
      root_extent: '{{ root_vgs[0].vg_extent_size | trim | int }}'
    when: h.root.enabled
  - name: Finite monotonic extent-aligned root target and outside-pool reserve
    ansible.builtin.assert:
      that:
      - h.root.target_mib is integer
      - h.root.target_mib is not boolean
      - h.root.authorized_cap_mib is integer
      - h.root.authorized_cap_mib is not boolean
      - h.root.reserve_vg_mib is integer
      - h.root.reserve_vg_mib is not boolean
      - h.root.target_mib > 0
      - h.root.target_mib <= h.root.authorized_cap_mib
      - h.root.reserve_vg_mib > 0
      - root_extent > 0
      - (h.root.target_mib * 1048576) % root_extent == 0
      - (h.root.authorized_cap_mib * 1048576) % root_extent == 0
      - root_lv_bytes > 0
      - root_lv_bytes <= h.root.target_mib * 1048576
      - fs_blocks > 0
      - fs_block_size > 0
      - fs_blocks * fs_block_size <= h.root.target_mib * 1048576
      - (h.root.target_mib * 1048576) % fs_block_size == 0
      - (h.root.target_mib * 1048576 - root_lv_bytes + h.root.reserve_vg_mib * 1048576) <= (root_vgs[0].vg_free
        | trim | int)
      - '(fs_probe.stdout | regex_findall("(?m)^Filesystem UUID: +(.+)$")) == [h.root.fs_uuid]'
      - '(fs_probe.stdout | regex_findall("(?m)^Filesystem features: +(.+)$"))[0].split() | difference(h.root.supported_ext4_features)
        | length == 0'
      - h.root.supported_ext4_features | length > 0
      fail_msg: 'Host storage refusal: missing, stale, ambiguous or out-of-envelope evidence; preserve original
        receipt and partial state.'
    when: h.root.enabled
  - name: Freeze only protected immutable LV mapping before root grow
    ansible.builtin.set_fact:
      root_protected_mapping: '{% set n = namespace(rows=[]) %}{% for r in initial_lvs %}{% if r.lv_uuid != h.root.lv_uuid
        %}{% set n.rows = n.rows + [{''lv_uuid'':r.lv_uuid, ''vg_uuid'':r.vg_uuid, ''lv_name'':r.lv_name, ''vg_name'':r.vg_name,
        ''lv_path'':r.lv_path, ''lv_size'':r.lv_size | trim, ''segtype'':r.segtype, ''pool_lv'':r.pool_lv, ''devices'':r.devices
        | default('''') | trim, ''metadata_size'':r.lv_metadata_size | default('''') | trim}] %}{% endif %}{% endfor
        %}{{ n.rows | sort(attribute=''devices'') | sort(attribute=''lv_uuid'') }}'
    when: h.root.enabled
  - name: Grow only existing admitted root LV
    community.general.lvol:
      vg: '{{ h.root.vg }}'
      lv: '{{ h.root.lv }}'
      size: '{{ h.root.target_mib }}m'
      state: present
      shrink: false
      force: false
      resizefs: false
      pvs:
      - '{{ root_pvs[0].pv_name }}'
    when: h.root.enabled and root_lv_bytes < h.root.target_mib * 1048576
  - name: Reread root LV and protected pool after LV convergence
    ansible.builtin.command:
      argv:
      - '{{ h.tools.lvs }}'
      - --reportformat
      - json
      - --units
      - b
      - --nosuffix
      - --options
      - lv_name,vg_name,lv_uuid,vg_uuid,lv_size,segtype,pool_lv,lv_path,data_percent,metadata_percent,lv_metadata_size,devices,lv_attr,lv_health_status
    register: grown_lv_probe
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Reread root mount before filesystem convergence
    ansible.builtin.command:
      argv:
      - /usr/bin/findmnt
      - --json
      - --list
      - --output
      - TARGET,SOURCE,UUID,FSTYPE,FSROOT,MAJ:MIN
    register: grown_mount_probe
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Reread actual root block device bytes
    ansible.builtin.command:
      argv:
      - '{{ h.tools.blockdev }}'
      - --getsize64
      - '{{ h.root.device }}'
    register: device_probe
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Reread existing ext4 after LV convergence
    ansible.builtin.command:
      argv:
      - '{{ h.tools.dumpe2fs }}'
      - -h
      - '{{ h.root.device }}'
    register: grown_fs_probe
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Decode fresh root convergence state
    ansible.builtin.set_fact:
      grown_root: '{{ (grown_lv_probe.stdout | from_json).report[0].lv | selectattr("lv_uuid", "equalto", h.root.lv_uuid)
        | list }}'
      grown_mount: '{{ (grown_mount_probe.stdout | from_json).filesystems | selectattr("target", "equalto", "/")
        | list }}'
      grown_blocks: '{{ (grown_fs_probe.stdout | regex_findall("(?m)^Block count: +([0-9]+)$"))[0] | int }}'
      goal_blocks: '{{ (h.root.target_mib * 1048576) // fs_block_size }}'
    when: h.root.enabled
  - name: Decode protected mapping after LV convergence
    ansible.builtin.set_fact:
      root_grown_mapping: '{% set n = namespace(rows=[]) %}{% for r in (grown_lv_probe.stdout | from_json).report[0].lv
        %}{% if r.lv_uuid != h.root.lv_uuid %}{% set n.rows = n.rows + [{''lv_uuid'':r.lv_uuid, ''vg_uuid'':r.vg_uuid,
        ''lv_name'':r.lv_name, ''vg_name'':r.vg_name, ''lv_path'':r.lv_path, ''lv_size'':r.lv_size | trim, ''segtype'':r.segtype,
        ''pool_lv'':r.pool_lv, ''devices'':r.devices | default('''') | trim, ''metadata_size'':r.lv_metadata_size
        | default('''') | trim}] %}{% endif %}{% endfor %}{{ n.rows | sort(attribute=''devices'') | sort(attribute=''lv_uuid'')
        }}'
      all_grown_mapping: '{% set n = namespace(rows=[]) %}{% for r in (grown_lv_probe.stdout | from_json).report[0].lv
        %}{% if r.lv_uuid != none %}{% set n.rows = n.rows + [{''lv_uuid'':r.lv_uuid, ''vg_uuid'':r.vg_uuid, ''lv_name'':r.lv_name,
        ''vg_name'':r.vg_name, ''lv_path'':r.lv_path, ''lv_size'':r.lv_size | trim, ''segtype'':r.segtype, ''pool_lv'':r.pool_lv,
        ''devices'':r.devices | default('''') | trim, ''metadata_size'':r.lv_metadata_size | default('''') | trim}]
        %}{% endif %}{% endfor %}{{ n.rows | sort(attribute=''devices'') | sort(attribute=''lv_uuid'') }}'
    when: h.root.enabled
  - name: Revalidate mounted identity and geometry before native ext4-only grow
    ansible.builtin.assert:
      that:
      - grown_root | length > 0
      - grown_root | map(attribute="lv_uuid") | unique | list == [h.root.lv_uuid]
      - grown_root | map(attribute="vg_uuid") | unique | list == [h.root.vg_uuid]
      - grown_root | map(attribute="lv_name") | unique | list == [h.root.lv]
      - grown_root | map(attribute="vg_name") | unique | list == [h.root.vg]
      - grown_root | map(attribute="lv_path") | unique | list == [h.root.device]
      - grown_root | map(attribute="lv_size") | unique | length == 1
      - grown_root | map(attribute="segtype") | unique | list == ["linear"]
      - grown_root | selectattr("devices", "match", "^" ~ (root_pvs[0].pv_name | regex_escape) ~ "\\([0-9]+\\)$")
        | list | length == grown_root | length
      - grown_root[0].lv_size | trim | int == h.root.target_mib * 1048576
      - device_probe.stdout | trim | int == h.root.target_mib * 1048576
      - grown_mount | length == 1
      - grown_mount[0] == root_mounts[0]
      - '(grown_fs_probe.stdout | regex_findall("(?m)^Filesystem UUID: +(.+)$")) == [h.root.fs_uuid]'
      - '(grown_fs_probe.stdout | regex_findall("(?m)^Block size: +([0-9]+)$"))[0] | int == fs_block_size'
      - '(grown_fs_probe.stdout | regex_findall("(?m)^Filesystem features: +(.+)$"))[0].split() | difference(h.root.supported_ext4_features)
        | length == 0'
      - grown_blocks >= fs_blocks
      - grown_blocks <= goal_blocks
      - root_grown_mapping == root_protected_mapping
      fail_msg: 'Host storage refusal: missing, stale, ambiguous or out-of-envelope evidence; preserve original
        receipt and partial state.'
    when: h.root.enabled
  - name: Converge existing ext4 independently including equal-LV retry
    ansible.builtin.command:
      argv:
      - '{{ h.tools.resize2fs }}'
      - '{{ h.root.device }}'
      - '{{ goal_blocks | string }}'
    when: h.root.enabled and grown_blocks < goal_blocks
    changed_when: true
    environment:
      LC_ALL: C
  - name: Verify ext4 postcondition independently
    ansible.builtin.command:
      argv:
      - '{{ h.tools.dumpe2fs }}'
      - -h
      - '{{ h.root.device }}'
    register: root_final_fs
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Verify final root mount
    ansible.builtin.command:
      argv:
      - /usr/bin/findmnt
      - --json
      - --list
      - --output
      - TARGET,SOURCE,UUID,FSTYPE,FSROOT,MAJ:MIN
    register: root_final_mount
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Verify final outside-pool reserve
    ansible.builtin.command:
      argv:
      - '{{ h.tools.vgs }}'
      - --reportformat
      - json
      - --units
      - b
      - --nosuffix
      - --options
      - vg_name,vg_uuid,vg_free,vg_extent_size
    register: root_final_vg
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Verify final protected LV identities
    ansible.builtin.command:
      argv:
      - '{{ h.tools.lvs }}'
      - --reportformat
      - json
      - --units
      - b
      - --nosuffix
      - --options
      - lv_name,vg_name,lv_uuid,vg_uuid,lv_size,segtype,pool_lv,lv_path,data_percent,metadata_percent,lv_metadata_size,devices,lv_attr,lv_health_status
    register: root_final_lv
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Capture final root df evidence
    ansible.builtin.command:
      argv:
      - /usr/bin/df
      - -B1
      - /
    register: root_df
    changed_when: false
    check_mode: false
    when: h.root.enabled
    environment:
      LC_ALL: C
  - name: Decode final immutable mapping independently
    ansible.builtin.set_fact:
      root_final_mapping: '{% set n = namespace(rows=[]) %}{% for r in (root_final_lv.stdout | from_json).report[0].lv
        %}{% if r.lv_uuid != none %}{% set n.rows = n.rows + [{''lv_uuid'':r.lv_uuid, ''vg_uuid'':r.vg_uuid, ''lv_name'':r.lv_name,
        ''vg_name'':r.vg_name, ''lv_path'':r.lv_path, ''lv_size'':r.lv_size | trim, ''segtype'':r.segtype, ''pool_lv'':r.pool_lv,
        ''devices'':r.devices | default('''') | trim, ''metadata_size'':r.lv_metadata_size | default('''') | trim}]
        %}{% endif %}{% endfor %}{{ n.rows | sort(attribute=''devices'') | sort(attribute=''lv_uuid'') }}'
    when: h.root.enabled
  - name: Root completion requires postconditions rather than exit status
    ansible.builtin.assert:
      that:
      - '(root_final_fs.stdout | regex_findall("(?m)^Filesystem UUID: +(.+)$")) == [h.root.fs_uuid]'
      - '(root_final_fs.stdout | regex_findall("(?m)^Block count: +([0-9]+)$"))[0] | int == goal_blocks'
      - (root_final_mount.stdout | from_json).filesystems | selectattr("target", "equalto", "/") | list == root_mounts
      - (root_final_vg.stdout | from_json).report[0].vg | selectattr("vg_uuid", "equalto", h.root.vg_uuid) | map(attribute="vg_free")
        | map("int") | min >= h.root.reserve_vg_mib * 1048576
      - root_final_mapping == all_grown_mapping
      fail_msg: 'Host storage refusal: missing, stale, ambiguous or out-of-envelope evidence; preserve original
        receipt and partial state.'
    when: h.root.enabled
  - name: Identify existing final handoff before stage mutation
    ansible.builtin.set_fact:
      final_mounts: '{{ mounts | selectattr("target", "equalto", h.stage.source) | list }}'
      stage_rows: '{{ initial_lvs | selectattr("vg_name", "equalto", h.stage.vg) | selectattr("lv_name", "equalto",
        h.stage.lv) | list }}'
      pool_rows: '{{ initial_lvs | selectattr("vg_name", "equalto", h.stage.vg) | selectattr("lv_name", "equalto",
        h.stage.pool) | list }}'
    when: h.stage.enabled
  - name: Detect exact final handoff no-action branch
    ansible.builtin.set_fact:
      final_candidate: '{{ final_mounts | length == 1 and final_mounts[0].uuid == h.stage.fs_uuid and final_mounts[0].fstype
        == "ext4" and final_mounts[0].fsroot == "/" and stage_rows | length == 1 and stage_rows[0].lv_uuid == h.stage.lv_uuid
        and stage_rows[0].vg_uuid == h.stage.vg_uuid and stage_rows[0].pool_lv == h.stage.pool and stage_rows[0].segtype
        == "thin" and stage_rows[0].lv_size | trim | int == h.stage.target_mib * 1048576 }}'
      final_handoff: false
    when: h.stage.enabled
