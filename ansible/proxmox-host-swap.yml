        - w.budgets.maximum_swap_rows is not boolean
        - 0 < w.budgets.maximum_swap_rows <= 9223372036854775807
        fail_msg: 'Host swap refusal: preserve original receipts and exact observed state; no automatic cleanup.'
    - name: Byte and extent caps
      ansible.builtin.assert:
        that:
        - w.budgets.maximum_extents <= 65536
        - w.budgets.maximum_record_bytes <= 1048576
        - w.budgets.preflight_seconds <= 86400
        - w.budgets.allocation_seconds <= 86400
        - w.budgets.activation_seconds <= 86400
        - w.budgets.maximum_probe_bytes <= 1048576
        - w.budgets.maximum_output_bytes <= 1048576
        - w.budgets.maximum_write_bytes >= w.target_mib * 1048576
        - w.budgets.aggregate_seconds >= w.budgets.preflight_seconds + w.budgets.allocation_seconds + w.budgets.activation_seconds
        fail_msg: 'Host swap refusal: preserve original receipts and exact observed state; no automatic cleanup.'
    - name: Typed physical incremental_swap_bytes
      ansible.builtin.assert:
