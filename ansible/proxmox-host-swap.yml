      # Standard bounded one-object IO primitives; Ansible owns phase/target/capacity policy.

      def safe_parent(path):
          if type(path) is not str or not path.startswith('/') or os.path.normpath(path)!=path:raise ValueError('canonical path')
          cursor='/'
          for component in path.split('/')[1:-1]:
              cursor=os.path.join(cursor,component)
              s=os.lstat(cursor)
              if not stat.S_ISDIR(s.st_mode):raise ValueError('symlink component')
          return os.open(os.path.dirname(path),os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)


      def observed_stat(s):
          return dict(dev=s.st_dev,dev_major=os.major(s.st_dev),dev_minor=os.minor(s.st_dev),inode=s.st_ino,nlink=s.st_nlink,
                      uid=s.st_uid,gid=s.st_gid,mode=stat.S_IMODE(s.st_mode),size=s.st_size,blocks=s.st_blocks,
                      mtime_ns=s.st_mtime_ns,ctime_ns=s.st_ctime_ns,
                      kind='regular' if stat.S_ISREG(s.st_mode) else 'directory' if stat.S_ISDIR(s.st_mode) else 'block' if stat.S_ISBLK(s.st_mode) else 'other')


      def read_bytes(path,cap):
          integer(cap,True);parent=safe_parent(path)
          try:
              fd=os.open(os.path.basename(path),os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK,dir_fd=parent)
              try:
                  before=os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink!=1 or before.st_size>cap:raise ValueError('bounded regular object')
                  raw=os.read(fd,cap+1);after=os.fstat(fd);named=os.stat(os.path.basename(path),dir_fd=parent,follow_symlinks=False)
                  if len(raw)!=before.st_size or len(raw)>cap or observed_stat(before)!=observed_stat(after) or observed_stat(named)!=observed_stat(after):raise ValueError('unstable read')
                  return raw,observed_stat(after)
              finally:os.close(fd)
          finally:os.close(parent)


      def atomic_bytes(u,phase,path,raw,mode,cap):
          if type(raw) is not bytes or len(raw)>cap or mode not in (0o600,0o644):raise ValueError('atomic payload')
          needed=2*len(raw)+1024
          if u['metadata_bytes_reserved']<needed or u['write_bytes_reserved']<needed:raise ValueError('missing metadata precharge')
          parent=safe_parent(path);tmp=os.path.basename(path)+'.qcl-tmp-'+u['attempt_id']+'-'+str(u['sequence']);fd=None;published=False
          try:
              guard(u,phase)
              fd=os.open(tmp,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,mode,dir_fd=parent)
              original=os.fstat(fd)
              offset=0
              while offset<len(raw):
                  guard(u,phase);n=os.write(fd,raw[offset:])
                  if n<=0:raise OSError('short write')
                  offset+=n
              guard(u,phase);os.fsync(fd)
              guard(u,phase);os.link(tmp,os.path.basename(path),src_dir_fd=parent,dst_dir_fd=parent,follow_symlinks=False);published=True
              guard(u,phase);os.fsync(parent)
              named=os.stat(tmp,dir_fd=parent,follow_symlinks=False);target=os.stat(os.path.basename(path),dir_fd=parent,follow_symlinks=False)
              if (named.st_dev,named.st_ino)!=(original.st_dev,original.st_ino) or (target.st_dev,target.st_ino)!=(original.st_dev,original.st_ino):raise ValueError('temporary inode changed')
              guard(u,phase);os.unlink(tmp,dir_fd=parent)
              guard(u,phase);os.fsync(parent)
          finally:
              if fd is not None:os.close(fd)
              os.close(parent)
          # Failed/orphan temp is retained; only the successful own link cleanup above is allowed.
          actual,s=read_bytes(path,cap)
          if actual!=raw or s['uid']!=0 or s['gid']!=0 or s['mode']!=mode or s['nlink']!=1:raise ValueError('atomic readback')
          return dict(stat=s,sha256=hashlib.sha256(actual).hexdigest(),bytes=len(actual),content_b64=base64.b64encode(actual).decode())


      def mkdir_one(u,phase,path):
          if min(u['metadata_bytes_reserved'],u['write_bytes_reserved'])<1024:raise ValueError('missing namespace precharge')
          parent=safe_parent(path)
          try:
              guard(u,phase);os.mkdir(os.path.basename(path),0o700,dir_fd=parent)
              guard(u,phase);os.fsync(parent)
              fd=os.open(os.path.basename(path),os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW,dir_fd=parent)
              try:guard(u,phase);os.fsync(fd);return observed_stat(os.fstat(fd))
              finally:os.close(fd)
          finally:os.close(parent)


      def create_one(u,phase,path):
          if min(u['metadata_bytes_reserved'],u['write_bytes_reserved'])<1024:raise ValueError('missing namespace precharge')
          parent=safe_parent(path)
          try:
              guard(u,phase);fd=os.open(os.path.basename(path),os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600,dir_fd=parent)
              try:guard(u,phase);os.fsync(fd);result=observed_stat(os.fstat(fd))
              finally:os.close(fd)
              guard(u,phase);os.fsync(parent);return result
          finally:os.close(parent)


      def record_observations(path,cap):
          if not os.path.lexists(path):return dict(exists=False,records={},binding_sha256=None,retained_bytes=0)
          parent=safe_parent(path)
          try:fd=os.open(os.path.basename(path),os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW,dir_fd=parent)
          finally:os.close(parent)
          try:
              directory=observed_stat(os.fstat(fd))
              if directory['uid']!=0 or directory['gid']!=0 or directory['mode']!=0o700:raise ValueError('record directory owner')
              entries=os.listdir(fd)
              allowed={x+'.json' for x in ('binding','allocation','format_intent','header','unit','activation_intent','completion')}
              if len(entries)>7 or set(entries)-allowed:raise ValueError('unknown record entry')
              records={};total=0
              for name in entries:
                  raw,s=read_bytes(os.path.join(path,name),cap);total+=len(raw)
                  if total>cap or s['uid']!=0 or s['gid']!=0 or s['mode']!=0o600:raise ValueError('record bytes/owner')
                  value=strict_load(raw)
                  if canonical(value)!=raw:raise ValueError('noncanonical record')
                  records[name[:-5]]=value
              binding=records.get('binding')
              return dict(exists=True,stat=directory,records=records,retained_bytes=total,binding_sha256=None if binding is None else hashlib.sha256(canonical(binding)).hexdigest())
          finally:os.close(fd)


      def object_observation(path,cap):
          if not os.path.lexists(path):return dict(exists=False)
          raw,s=read_bytes(path,cap)
          return dict(exists=True,stat=s,sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),content_b64=base64.b64encode(raw).decode())


      def block_observation(path):
          resolved=os.path.realpath(path,strict=True)
          parent=safe_parent(resolved)
          try:fd=os.open(os.path.basename(resolved),os.O_RDONLY|os.O_NONBLOCK|os.O_NOFOLLOW,dir_fd=parent)
          finally:os.close(parent)
          try:
              s=os.fstat(fd)
              if not stat.S_ISBLK(s.st_mode):raise ValueError('canonical block node')
              return dict(path=resolved,kind='block',rdev=[os.major(s.st_rdev),os.minor(s.st_rdev)])
          finally:os.close(fd)


      def area_observation(path):
          resolved=os.path.realpath(path,strict=True);parent=safe_parent(resolved)
          try:fd=os.open(os.path.basename(resolved),os.O_RDONLY|os.O_NONBLOCK|os.O_NOFOLLOW,dir_fd=parent)
          finally:os.close(parent)
          try:
              s=os.fstat(fd)
              if stat.S_ISBLK(s.st_mode):identity=dict(kind='block',rdev=[os.major(s.st_rdev),os.minor(s.st_rdev)])
              elif stat.S_ISREG(s.st_mode):identity=dict(kind='file',dev=[os.major(s.st_dev),os.minor(s.st_dev)],inode=s.st_ino)
              else:raise ValueError('unsupported swap identity')
              return dict(path=resolved,identity=identity)
          finally:os.close(fd)


      def main_primitive():
          u=strict_load(sys.argv[1]);phase=sys.argv[2];op=sys.argv[3];guard(u,phase)
          if op=='mkdir':result=mkdir_one(u,phase,sys.argv[4])
          elif op=='create':result=create_one(u,phase,sys.argv[4])
          elif op=='atomic':result=atomic_bytes(u,phase,sys.argv[4],base64.b64decode(sys.argv[5],validate=True),int(sys.argv[6]),int(sys.argv[7]))
          elif op=='records':result=record_observations(sys.argv[4],int(sys.argv[5]))
          elif op=='fragment':result=object_observation(sys.argv[4],int(sys.argv[5]))
          elif op=='block':result=block_observation(sys.argv[4])
          elif op=='area':result=area_observation(sys.argv[4])
          elif op=='budget-shape':
              result=validate_usage(strict_load(sys.argv[4]))
