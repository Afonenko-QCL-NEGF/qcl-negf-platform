          elif op=='json':result=strict_load(sys.argv[4])
          elif op=='json-lines':result=[strict_load(line) for line in sys.argv[4].splitlines()]
          else:raise ValueError('primitive operation')
          sys.stdout.buffer.write(canonical(result)+b'\n')

      u=strict_load(sys.argv[1]);phase=sys.argv[2];guard(u,phase)
