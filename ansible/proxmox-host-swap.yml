            - io_result.usage.phase_elapsed_ns.allocation >= b.phase_elapsed_ns.allocation
            - io_result.usage.phase_elapsed_ns.activation >= b.phase_elapsed_ns.activation
            - io_result.usage.output_bytes > b.output_bytes
            - io_result.usage.output_bytes <= b.limits.output_bytes
            - io_result.usage.write_bytes_reserved == b.write_bytes_reserved + (0)
            - io_result.usage.metadata_bytes_reserved == b.metadata_bytes_reserved + (0)
            - io_result.owned_children_complete is sameas true
            - io_result.failure == none
            - io_result.rc in [0]
            fail_msg: host_swap:swap_properties_enabled_transport
          vars:
            io_result: '{{ _io.stdout | from_json }}'
          when: load_enabled.LoadState == "loaded"
        - name: swap_properties_enabled_response
          ansible.builtin.set_fact:
            _swap_props: '{{ {"rc": (_io.stdout | from_json).rc, "stdout": (_io.stdout | from_json).stdout_b64 | b64decode,
              "stderr": (_io.stdout | from_json).stderr_b64 | b64decode} }}'
            b: '{{ (_io.stdout | from_json).usage }}'
          when: load_enabled.LoadState == "loaded"
        - name: swap_properties_parse_enabled_value
          ansible.builtin.set_fact:
            sp_enabled: '{{ _swap_props.stdout.splitlines() | map("from_json") | list }}'
          when: load_enabled.LoadState == "loaded"
        - name: unit_typed_enabled
          ansible.builtin.assert:
            that:
            - props_enabled | length == 13
            - props_enabled | map(attribute="type") | list == ['s', 's', 'as', 'b', 'b', 's', 's', 's', 'as', 'as', 'as',
              'a(sbbsi)', 'b']
            - sp_enabled | length == 3
            - sp_enabled | map(attribute="type") | list == ["s","s","t"]
            fail_msg: host_swap:unit_typed_enabled
          when: load_enabled.LoadState == "loaded"
        - name: unit_native_object_keys_enabled
          ansible.builtin.assert:
            that:
            - item.keys() | list | sort == ["data","type"]
            fail_msg: host_swap:unit_native_object_keys_enabled
          loop: '{{ props_enabled + sp_enabled }}'
          when: load_enabled.LoadState == "loaded"
        - name: fragment_owned_enabled
          ansible.builtin.assert:
            that:
            - fragment_enabled.exists
            - fragment_enabled.stat.kind == "regular"
            - fragment_enabled.stat.uid == 0
            - fragment_enabled.stat.gid == 0
            - fragment_enabled.stat.mode == 420
            - fragment_enabled.stat.nlink == 1
            - fragment_enabled.bytes == fragment_bytes
            - fragment_enabled.sha256 == fragment_sha
            - fragment_enabled.content_b64 == fragment_text | b64encode
            fail_msg: host_swap:fragment_owned_enabled
          when: load_enabled.LoadState == "loaded"
        - name: unit_policy_enabled
          ansible.builtin.assert:
            that:
            - props_enabled[0].data == w.unit
            - props_enabled[1].data == fragment_path
            - props_enabled[2].data == []
            - props_enabled[3].data is sameas false
            - props_enabled[4].data is sameas true
            - props_enabled[5].data == "loaded"
            - props_enabled[6].data in ["active","inactive"]
            - props_enabled[7].data in ["enabled","disabled"]
            - w.mount.unit in props_enabled[8].data
            - w.mount.unit in props_enabled[9].data
            - props_enabled[10].data | sort == [w.mount.path, w.path] | sort
            - props_enabled[10].data | length == 2
            - props_enabled[8].data is sequence
            - props_enabled[8].data is not string
            - props_enabled[9].data is sequence
            - props_enabled[9].data is not string
            - props_enabled[10].data is sequence
            - props_enabled[10].data is not string
            - sp_enabled[0].data == w.path
            - sp_enabled[1].data == ""
            - sp_enabled[2].data is integer
            - sp_enabled[2].data is not boolean
            - 0 < sp_enabled[2].data < 18446744073709551615
            - sp_enabled[2].data == w.budgets.activation_seconds * 1000000
            fail_msg: host_swap:unit_policy_enabled
          when: load_enabled.LoadState == "loaded"
        - name: unit_conditions_enabled
          ansible.builtin.assert:
            that:
            - props_enabled[11].data | length == 1
            - props_enabled[11].data is sequence
            - props_enabled[11].data is not string
            - props_enabled[11].data[0] | length == 5
            - props_enabled[11].data[0] is sequence
            - props_enabled[11].data[0] is not string
            - props_enabled[11].data[0][0] == "ConditionPathIsMountPoint"
            - props_enabled[11].data[0][1] is sameas false
            - props_enabled[11].data[0][2] is sameas false
            - props_enabled[11].data[0][3] == w.mount.path
            - props_enabled[11].data[0][4] is integer
            - props_enabled[11].data[0][4] is not boolean
            - props_enabled[11].data[0][4] in [0,1]
            - props_enabled[12].data is boolean
            - props_enabled[6].data != "active" or (props_enabled[11].data[0][4] == 1 and props_enabled[12].data is sameas
              true)
            fail_msg: host_swap:unit_conditions_enabled
          when: load_enabled.LoadState == "loaded"
        - name: unit_active_post_enabled
          ansible.builtin.assert:
            that:
            - load_enabled.LoadState == "loaded"
            - props_enabled[6].data == "active"
            - props_enabled[11].data[0][4] == 1
            - props_enabled[12].data is sameas true
            fail_msg: host_swap:unit_active_post_enabled
        - name: enabled_verified
          ansible.builtin.assert:
            that:
            - props_enabled[7].data == "enabled"
            fail_msg: host_swap:enabled_verified
        - name: build_completion_envelope
          ansible.builtin.set_fact:
            envelope_completion: '{{ {"schema": "qcl.host-swap.completion.v2", "context_sha256": context_sha, "binding_sha256":
              binding_sha, "payload": {"file_identity":file_identity,"header_uuid":w.header_uuid,"header_sample_sha256":file_post.sample_sha256,"usable_bytes":target_bytes-page_bytes,"boot_enabled":true,"lifetime":w.lifetime,"old_static_swaps":old_post,"actual_swaps_observation":swaps_post,"budget_usage":b},
              "provenance": {"source": h.accepted_source, "attempt_id": h.attempt_id, "boot_id": h.boot_id}} }}'
        - name: serialize_completion
          ansible.builtin.set_fact:
            bytes_completion: '{{ envelope_completion | to_json(sort_keys=true, separators=(",", ":"), ensure_ascii=false,
              allow_nan=false) }}'
        - name: encoded_length_completion
          ansible.builtin.set_fact:
            length_completion: '{{ ((bytes_completion | b64encode) | length) // 4 * 3 - (2 if (bytes_completion | b64encode).endswith("==")
              else 1 if (bytes_completion | b64encode).endswith("=") else 0) }}'
        - name: record_bytes_completion
          ansible.builtin.assert:
            that:
            - retained_record_bytes + length_completion <= w.budgets.maximum_record_bytes
            fail_msg: host_swap:record_bytes_completion
          when: '"completion" not in records'
        - name: write_completion
          ansible.builtin.command:
            argv:
            - '{{ h.tools.python3 }}'
            - -c
            - '{{ run_code }}'
            - run-v2
            - '{{ b | to_json }}'
            - activation
            - '{{ 2*length_completion+1024 }}'
            - '{{ 2*length_completion+1024 }}'
            - '{{ [((h.tools.python3)) | string, ("-c") | string, ((primitive_code)) | string, ("@BUDGET@") | string, ("activation")
              | string, ("atomic") | string, ("" ~ (w.receipts) ~ "/completion.json") | string, ((bytes_completion | b64encode))
              | string, ("384") | string, ((w.budgets.maximum_record_bytes)) | string] | to_json }}'
          register: _io
          changed_when: false
          check_mode: false
          environment:
            LC_ALL: C
          when: '"completion" not in records'
        - name: write_completion_transport
          ansible.builtin.assert:
            that:
            - _io.rc == 0
            - io_result.schema == "qcl.host-swap.io-result.v1"
            - io_result.usage.schema == "qcl.host-swap.budget.v1"
            - io_result.usage.sequence == b.sequence + 1
            - io_result.usage.attempt_id == b.attempt_id
            - io_result.usage.boot_id == b.boot_id
            - io_result.usage.limits == b.limits
            - io_result.usage.started_monotonic_ns == b.started_monotonic_ns
            - io_result.usage.deadline_monotonic_ns == b.deadline_monotonic_ns
            - io_result.usage.last_monotonic_ns >= b.last_monotonic_ns
            - io_result.usage.phase_elapsed_ns.preflight >= b.phase_elapsed_ns.preflight
            - io_result.usage.phase_elapsed_ns.allocation >= b.phase_elapsed_ns.allocation
            - io_result.usage.phase_elapsed_ns.activation >= b.phase_elapsed_ns.activation
            - io_result.usage.output_bytes > b.output_bytes
            - io_result.usage.output_bytes <= b.limits.output_bytes
            - io_result.usage.write_bytes_reserved == b.write_bytes_reserved + (2*length_completion+1024)
            - io_result.usage.metadata_bytes_reserved == b.metadata_bytes_reserved + (2*length_completion+1024)
            - io_result.owned_children_complete is sameas true
            - io_result.failure == none
            - io_result.rc in [0]
            fail_msg: host_swap:write_completion_transport
          vars:
            io_result: '{{ _io.stdout | from_json }}'
          when: '"completion" not in records'
        - name: write_completion_response
          ansible.builtin.set_fact:
            _written: '{{ {"rc": (_io.stdout | from_json).rc, "stdout": (_io.stdout | from_json).stdout_b64 | b64decode, "stderr":
              (_io.stdout | from_json).stderr_b64 | b64decode} }}'
            b: '{{ (_io.stdout | from_json).usage }}'
          when: '"completion" not in records'
        - name: retain_completion
          ansible.builtin.set_fact:
            retained_record_bytes: '{{ retained_record_bytes + length_completion }}'
            records: '{{ records | combine({"completion": envelope_completion}) }}'
          when: '"completion" not in records'
      when: h.apply | bool and not h.preflight_only | bool and not ansible_check_mode
    when: w.enabled | bool
