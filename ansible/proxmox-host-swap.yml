- name: Additive protected host swap only
  hosts: proxmox_hypervisors
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    h: '{{ {''apply'': false, ''preflight_only'': false, ''swap'': {''enabled'': false}} | combine(qcl_host_storage
      | default({}), recursive=true) }}'
    w: '{{ h.swap }}'
    mkdir_code: |
      import json, os, stat, sys
      p=sys.argv[2]
      os.mkdir(p,0o700)
      parent=os.open(os.path.dirname(p),os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
      try: os.fsync(parent)
      finally: os.close(parent)
      fd=os.open(p,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
      try:
       os.fsync(fd);s=os.fstat(fd)
       print(json.dumps(dict(dev=s.st_dev,inode=s.st_ino,uid=s.st_uid,gid=s.st_gid,mode=stat.S_IMODE(s.st_mode))))
      finally: os.close(fd)
    create_code: |
      import json, os, stat, sys
      p=sys.argv[2]
      fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o600)
      try:
       os.fsync(fd);s=os.fstat(fd)
       print(json.dumps(dict(dev=s.st_dev,inode=s.st_ino,nlink=s.st_nlink,uid=s.st_uid,gid=s.st_gid,mode=stat.S_IMODE(s.st_mode),size=s.st_size,blocks=s.st_blocks,mtime_ns=s.st_mtime_ns,ctime_ns=s.st_ctime_ns,kind="regular" if stat.S_ISREG(s.st_mode) else "other")))
      finally: os.close(fd)
      pfd=os.open(os.path.dirname(p),os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
      try: os.fsync(pfd)
      finally: os.close(pfd)
    seal_code: |
      import json, os, stat, sys
      p=sys.argv[2];cap=int(sys.argv[3])
      fd=os.open(p,os.O_RDONLY|os.O_NOFOLLOW)
      try:
       s=os.fstat(fd)
       if not stat.S_ISREG(s.st_mode) or s.st_uid!=0 or s.st_gid!=0 or stat.S_IMODE(s.st_mode)!=0o600 or s.st_nlink!=1 or s.st_size>cap:raise ValueError("invalid record")
       total=sum(os.lstat(os.path.join(os.path.dirname(p),n)).st_size for n in os.listdir(os.path.dirname(p)))
       if total>cap:raise ValueError("aggregate record bound")
       os.fsync(fd);raw=os.read(fd,cap+1)
       if len(raw)>cap:raise ValueError("record bound")
      finally:os.close(fd)
      pfd=os.open(os.path.dirname(p),os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
      try:os.fsync(pfd)
      finally:os.close(pfd)
      print(json.dumps(json.loads(raw)))
    records_code: |
      import hashlib, json, os, stat, sys
      p=sys.argv[2];cap=int(sys.argv[3]);out=dict(exists=False,records={},binding_sha256=None)
      if os.path.lexists(p):
       fd=os.open(p,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
       try:
        s=os.fstat(fd);out.update(exists=True,stat=dict(dev=s.st_dev,inode=s.st_ino,uid=s.st_uid,gid=s.st_gid,mode=stat.S_IMODE(s.st_mode)))
        entries=os.listdir(fd)
        allowed={x+".json" for x in ("binding","allocation","format_intent","header","unit","activation_intent","completion")}
        if len(entries)>7 or set(entries)-allowed:raise ValueError("unknown record entry")
        total=0
        for name in entries:
         r=os.open(name,os.O_RDONLY|os.O_NOFOLLOW,dir_fd=fd)
         try:
          rs=os.fstat(r)
          if not stat.S_ISREG(rs.st_mode) or rs.st_nlink!=1 or rs.st_uid!=0 or rs.st_gid!=0 or stat.S_IMODE(rs.st_mode)!=0o600:raise ValueError("unowned record")
          total+=rs.st_size
          if total>cap:raise ValueError("record byte cap")
          raw=os.read(r,cap+1)
          out["records"][name[:-5]]=json.loads(raw)
         finally:os.close(r)
        b=out["records"].get("binding")
        if b is not None:out["binding_sha256"]=hashlib.sha256(json.dumps(b,sort_keys=True,separators=(",",":")).encode()).hexdigest()
       finally:os.close(fd)
      print(json.dumps(out))
    probe_code: |
      import json, os, stat, sys
      import fcntl
      import hashlib
      import json
      import os
      import stat
      import struct

      FIEMAP = 0xC020660B
      EXTENT = struct.Struct("=QQQQQIIII")
      HEADER = struct.Struct("=QQIIII")


      def identity(s):
          return dict(dev=s.st_dev, inode=s.st_ino, nlink=s.st_nlink, uid=s.st_uid,
                      gid=s.st_gid, mode=stat.S_IMODE(s.st_mode), size=s.st_size,
                      blocks=s.st_blocks, mtime_ns=s.st_mtime_ns, ctime_ns=s.st_ctime_ns,
                      kind="regular" if stat.S_ISREG(s.st_mode) else "other")


      def safe_components(path):
          if not os.path.isabs(path) or os.path.normpath(path) != path:
              raise ValueError("absolute canonical path required")
          parts=path.split("/")[1:]
          cursor="/"
          for part in parts[:-1]:
              cursor=os.path.join(cursor,part)
              s=os.lstat(cursor)
              if not stat.S_ISDIR(s.st_mode):
                  raise ValueError("symlink or nondirectory component")


      def probe(path, *, maximum_extents, maximum_bytes, ioctl_fn=fcntl.ioctl, hole_fn=None):
          path=os.fspath(path)
          if type(maximum_extents) is not int or not 0 < maximum_extents <= 65536:
              raise ValueError("finite extent bound required")
          if type(maximum_bytes) is not int or not 0 < maximum_bytes <= 1048576:
              raise ValueError("finite byte bound required")
          safe_components(path)
          fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC)
          try:
              before=os.fstat(fd)
              if not stat.S_ISREG(before.st_mode):raise ValueError("regular file required")
              size=before.st_size
              buffer=bytearray(HEADER.size+EXTENT.size*maximum_extents)
              HEADER.pack_into(buffer,0,0,size,1,0,maximum_extents,0)
              ioctl_fn(fd,FIEMAP,buffer,True)
              _,_,_,count,_,_=HEADER.unpack_from(buffer)
              if count>maximum_extents:raise ValueError("invalid FIEMAP count")
              covered=0;unsupported=0;last=False;layout=[];aligned=True
              for i in range(count):
                  logical,physical,length,_,_,flags,_,_,_=EXTENT.unpack_from(buffer,HEADER.size+i*EXTENT.size)
                  if length<=0:raise ValueError("invalid FIEMAP length")
                  end=min(size,logical+length)
                  if logical<size:
                      unsupported|=flags & ~1
                      aligned=aligned and logical%512==0 and physical%512==0 and length%512==0
                      if logical!=covered:aligned=False
                      covered=end
                      layout.append((logical,physical,end-logical,flags))
                  if flags&1:last=True
              capped=not last and size>0
              try:
                  hole=hole_fn(fd) if hole_fn else os.lseek(fd,0,os.SEEK_HOLE)
              except OSError:hole=None
              observed=os.pread(fd,min(maximum_bytes,size),0)
              after=os.fstat(fd)
              try:named=os.lstat(path)
              except FileNotFoundError:named=None
              stable=identity(before)==identity(after) and named is not None and identity(named)==identity(after)
              return dict(exists=True,stat=identity(after),stable=stable,coverage_complete=covered==size and aligned and not capped and unsupported==0,
                          scan_capped=capped,unsupported_flags=unsupported,hole_offset=hole,
                          observed_bytes=len(observed),sample_sha256=hashlib.sha256(observed).hexdigest(),
                          layout_hash=hashlib.sha256(json.dumps(layout,separators=(",",":")).encode()).hexdigest())
          finally:os.close(fd)



      p=sys.argv[2];parent=os.path.dirname(p);out=dict(exists=False,parent=dict(exists=False))
      # Check every existing ancestor with lstat; absence allowed only at immediate parent.
      if os.path.lexists(parent):
       safe_components(p)
       s=os.lstat(parent)
       if not stat.S_ISDIR(s.st_mode):raise ValueError("invalid parent")
       out["parent"]=dict(exists=True,dev=s.st_dev,inode=s.st_ino,uid=s.st_uid,gid=s.st_gid,mode=stat.S_IMODE(s.st_mode))
      else:safe_components(parent)
      if os.path.lexists(p):
       out.update(probe(p,maximum_extents=int(sys.argv[3]),maximum_bytes=int(sys.argv[4])))
      print(json.dumps(out))
    run_code: |
      import json, os, selectors, signal, subprocess, sys, time
      seconds=float(sys.argv[2]);cap=int(sys.argv[3]);argv=json.loads(sys.argv[4])
      if not 0<seconds<=86400 or not 0<cap<=1048576:raise ValueError("finite capture bound")
      p=subprocess.Popen(argv,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)
      s=selectors.DefaultSelector();s.register(p.stdout,1,sys.stdout.buffer);s.register(p.stderr,1,sys.stderr.buffer)
      t=time.monotonic();deadline=float(sys.argv[5]);size=0;reason=None
      while s.get_map():
       for key,_ in s.select(0.05):
        data=os.read(key.fd,16384)
        if not data:s.unregister(key.fileobj);continue
        size+=len(data)
        if size>cap:reason="output cap";data=b""
        key.data.write(data);key.data.flush()
       if time.monotonic()-t>seconds or (deadline and time.time()>deadline):reason="time cap"
       if reason:
        try:os.killpg(p.pid,signal.SIGKILL)
        except ProcessLookupError:pass
        break
      rc=p.wait()
      if reason:sys.stderr.write(reason+"\n");sys.exit(124)
      sys.exit(rc)
  tasks:
  - name: Strict opt in
    ansible.builtin.assert:
      that:
      - h.apply is boolean
      - h.preflight_only is boolean
      - w.enabled is boolean
      - not w.enabled or (h.preflight_only != h.apply)
      - not w.enabled or not ansible_check_mode
      fail_msg: 'Host swap refusal: preserve original receipts and exact observed state; no automatic cleanup.'
  - name: Exact enabled preflight
    when: w.enabled
    block:
    - name: Accepted private operation
      ansible.builtin.assert:
        that:
        - h.accepted_source is string
        - h.accepted_source | length > 0
        - h.attempt_id is string
        - h.original_receipt is string
        - h.attempt_id != h.original_receipt
        - h.admission.fresh is sameas true
        - h.admission.exclusive is sameas true
        - h.admission.operation_owner == h.attempt_id
        - h.admission.receipt | length > 0
        - w.mount.accepted is sameas true
        - w.mount.cutover_receipt | length > 0
        - w.lifetime == "protected-host-infrastructure"
        - w.support.fresh is sameas true
        - w.support.receipt | length > 0
        - w.ledger.fresh is sameas true
        - w.ledger.receipt | length > 0
        fail_msg: 'Host swap refusal: preserve original receipts and exact observed state; no automatic cleanup.'
    - name: Finite exact geometry
      ansible.builtin.assert:
        that:
        - w.target_mib is integer
        - w.target_mib is not boolean
        - w.authorized_cap_mib is integer
        - w.authorized_cap_mib is not boolean
        - 0 < w.target_mib <= w.authorized_cap_mib
        - w.header_uuid is match("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")
        - w.header_uuid != "00000000-0000-0000-0000-000000000000"
        - w.header_uuid != w.mount.fs_uuid
        - w.path is match("^/[A-Za-z0-9_./-]+$")
        - w.parent is match("^/[A-Za-z0-9_./-]+$")
        - w.receipts is match("^/[A-Za-z0-9_./-]+$")
        - '".." not in w.path.split("/")'
        - '"." not in w.path.split("/")'
        - w.path | dirname == w.parent
        - w.parent.startswith(w.mount.path + "/")
        - not w.path.startswith("/var/lib/vz/")
        - not w.receipts.startswith(w.mount.path + "/")
        - w.support.direct is sameas true
        - w.support.fiemap is sameas true
        - w.support.ext4 is sameas true
        - w.support.swapon_json is sameas true
        - w.support.systemd_version == 257
        fail_msg: 'Host swap refusal: preserve original receipts and exact observed state; no automatic cleanup.'
    - name: Finite preflight_seconds
      ansible.builtin.assert:
        that:
        - w.budgets.preflight_seconds is integer
        - w.budgets.preflight_seconds is not boolean
        - 0 < w.budgets.preflight_seconds <= 9223372036854775807
        fail_msg: 'Host swap refusal: preserve original receipts and exact observed state; no automatic cleanup.'
    - name: Finite allocation_seconds
      ansible.builtin.assert:
