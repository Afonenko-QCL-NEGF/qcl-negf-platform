    - name: Initial native clock
      ansible.builtin.command:
        argv:
        - '{{ h.tools.python3 }}'
        - -c
        - '{{ run_code }}'
        - run
        - '{{ w.budgets.preflight_seconds }}'
        - '{{ w.budgets.maximum_output_bytes }}'
        - '{{ [("/usr/bin/date") | string, ("+%s") | string] | to_json }}'
        - '{{ started + w.budgets.aggregate_seconds if started is defined else 0 }}'
      register: clock
      changed_when: false
      check_mode: false
      environment:
        LC_ALL: C
    - name: Start observed deadline
      ansible.builtin.set_fact:
        started: '{{ clock.stdout | trim | int }}'
    - name: Fresh expiry
      ansible.builtin.assert:
        that:
        - h.admission.expires_at_epoch is integer
        - h.admission.expires_at_epoch is not boolean
        - h.admission.expires_at_epoch > started
        - w.ledger.expires_at_epoch is integer
        - w.ledger.expires_at_epoch > started
        fail_msg: 'Host swap refusal: preserve original receipts and exact observed state; no automatic cleanup.'
    - name: Host identity
      ansible.builtin.command:
        argv:
        - '{{ h.tools.python3 }}'
        - -c
        - '{{ run_code }}'
        - run
        - '{{ w.budgets.preflight_seconds }}'
        - '{{ w.budgets.maximum_output_bytes }}'
        - '{{ [("/usr/bin/cat") | string, ("/etc/machine-id") | string] | to_json }}'
        - '{{ started + w.budgets.aggregate_seconds if started is defined else 0 }}'
      register: host
      changed_when: false
      check_mode: false
      environment:
        LC_ALL: C
    - name: Boot identity
