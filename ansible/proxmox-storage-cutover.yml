- name: Opt-in retained Proxmox directory cutover only
  hosts: proxmox_hypervisors
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    h: '{{ {''apply'':false,''cutover'':{''enabled'':false}} | combine(qcl_host_storage | default({}),recursive=true)
      }}'
    c: '{{ h.cutover }}'
    cutover_native_probe: "import hashlib,json,os,pathlib,re,stat,subprocess,sys,time\nfrom decimal import\
      \ Decimal,ROUND_CEILING\nr=json.load(sys.stdin); h=r['h']; c=h['cutover']; start=time.monotonic();\
      \ cap=c['limits']['output_bytes']\ndef need(condition,message):\n if not condition: raise ValueError(message)\n\
      scope={'__name__':'nested'};exec(r['boundary'],scope);invocation=json.loads(os.environ['QCL_CUTOVER_REQUEST']);runner=scope['NestedRunner'](invocation)\n\
      metadata_total=0\ndef run(argv,allowed=(0,)):\n result=runner.run(argv,allowed);need(metadata_total+runner.total<=c['limits']['metadata_read_bytes'],'whole\
      \ probe metadata cap');return result\ndef bounded_file(path,maximum=65536):\n global metadata_total\n\
      \ s=os.lstat(path);need(stat.S_ISREG(s.st_mode) and s.st_size<=maximum and (str(path).startswith('/proc/')\
      \ or s.st_uid==0) and s.st_nlink==1,'untrusted prerequisite file')\n fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)\n\
      \ try:\n  data=scope['metadata_file'](path,maximum);metadata_total+=len(data);need(metadata_total+runner.total<=c['limits']['metadata_read_bytes'],'whole\
      \ probe metadata cap');need(len(data)<=maximum,'prerequisite cap');return data\n finally:os.close(fd)\n\
      def exact_receipt(ref):\n need(type(ref)==dict and set(ref)=={'path','sha256'},'exact prerequisite\
      \ receipt reference')\n data=bounded_file(ref['path']);need(hashlib.sha256(data).hexdigest()==ref['sha256'],'prerequisite\
      \ changed')\n return json.loads(data)\nnow=int(time.time());need(now<h['admission']['expires_at_epoch']\
      \ and now<c['window']['expires_at_epoch'],'expired admission/window')\nhost=bounded_file('/etc/machine-id').decode().strip();boot=bounded_file('/proc/sys/kernel/random/boot_id').decode().strip()\n\
      need(host==h['host_id'] and boot==h['boot_id'],'host/boot mismatch')\nwindow=exact_receipt(c['window']['reference'])\n\
      need(window['held'] is True and window['host_id']==host and window['boot_id']==boot and window['attempt_id']==h['attempt_id']\
      \ and window['owner']==c['window']['owner'] and window['expires_at_epoch']==c['window']['expires_at_epoch']\
      \ and window['scope']==c['window']['scope'],'held caller window changed')\nfor key in ('d04_receipt','r1r2_receipt','seed_receipt'):\n\
      \ prerequisite=exact_receipt(c['preconditions'][key]);need(prerequisite['accepted'] is True,'unaccepted\
      \ native prerequisite')\nneed(run(['/usr/bin/systemctl','is-active',c['preconditions']['old_installer_unit']],(0,3)).strip()\
      \ in ('inactive','failed'),'old installer still active')\nloops=json.loads(run(['/usr/sbin/losetup','--json','--list','--output','NAME,BACK-FILE']))['loopdevices']\n\
      for loop in loops:\n backing=loop['back-file'];need(type(backing) is str and backing and not backing.endswith('\
      \ (deleted)'),'unknown/deleted loop backing')\n canonical=os.path.realpath(backing);need(canonical!=os.path.realpath(c['preconditions']['old_installer_backing']),'old\
      \ installer loop backing remains')\n for named in (c['source']['path'],h['stage']['path'],c['rollback']['path']):\n\
      \  need(not(canonical==named or canonical.startswith(named.rstrip('/')+'/')),'relevant loop backing\
      \ alias')\nstorage=json.loads(run(['/usr/bin/perl','-MPVE::Storage','-MPVE::Storage::DirPlugin','-MPVE::JSONSchema','-MJSON','-e',\n\
      \ 'my $c=PVE::Storage::config(); my $s=PVE::Storage::storage_config($c,$ARGV[0]); my $o=JSON::decode_json($ARGV[1]);\
      \ $c->{selected_mountpoint}=PVE::Storage::DirPlugin::parse_is_mountpoint($s); $c->{selected_disabled}=PVE::JSONSchema::parse_boolean($s->{disable}//0);\
      \ $c->{original_disabled}=PVE::JSONSchema::parse_boolean($o->{disable}//0); print JSON::encode_json($c);',c['storage']['id'],json.dumps(r.get('original_storage',c['storage']['stanza']))]))\n\
      need(type(storage['selected_disabled']) in (int,bool) and storage['selected_disabled'] in (0,1)\
      \ and type(storage['original_disabled']) in (int,bool) and storage['original_disabled'] in (0,1),'unknown\
      \ native disable semantics')\nselected=storage['ids'][c['storage']['id']];foreign={k:v for k,v in\
      \ storage['ids'].items() if k!=c['storage']['id']}\nneed(foreign==c['storage']['foreign'],'foreign\
      \ storage changed')\nfixed=lambda x:{k:v for k,v in x.items() if k not in ('disable','is_mountpoint')}\n\
      need(fixed(selected)==fixed(c['storage']['stanza']),'selected fixed stanza changed')\nrows=json.loads(run([h['tools']['lvs'],'--reportformat','json','--units','b','--nosuffix','-o','lv_name,vg_name,lv_uuid,vg_uuid,pool_lv,lv_size,lv_metadata_size,data_percent,metadata_percent,lv_health_status,segtype,lv_path']))['report'][0]['lv']\n\
      pool=[x for x in rows if x['lv_uuid'].strip()==c['capacity']['pool_uuid']];need(len(pool)==1,'pool\
      \ identity unknown');pool=pool[0]\nfor field in ('data_percent','metadata_percent'):\n value=pool[field].strip();need(bool(re.fullmatch(r'(?:[0-9]+(?:\\\
      .[0-9]+)?|\\.[0-9]+)',value)) and 0<=float(value)<=100,'unknown pool usage')\nneed(pool['lv_health_status'].strip()=='','pool\
      \ unhealthy')\nfor f in ('lv_size','lv_metadata_size'):need(bool(re.fullmatch(r'[0-9]+(?:\\.0+)?',pool[f].strip())),'unknown\
      \ physical pool size')\ndata=int(Decimal(pool['lv_size'].strip()));metadata=int(Decimal(pool['lv_metadata_size'].strip()))\n\
      need(data==c['capacity']['data_bytes'] and metadata==c['capacity']['metadata_bytes'],'pool fixed\
      \ bounds changed')\ndata_used=int((Decimal(data)*Decimal(pool['data_percent'].strip())/100).to_integral_value(rounding=ROUND_CEILING));meta_used=int((Decimal(metadata)*Decimal(pool['metadata_percent'].strip())/100).to_integral_value(rounding=ROUND_CEILING))\n\
      need(data_used+c['capacity']['growth_bytes']+c['capacity']['image_envelope_bytes']+c['capacity']['data_reserve_bytes']<=data,'thin\
      \ data bound')\nneed(meta_used+c['capacity']['metadata_growth_bytes']+c['capacity']['metadata_reserve_bytes']<=metadata,'thin\
      \ metadata bound')\nprojection=sorted([{k:x[k].strip() for k in ('lv_uuid','vg_uuid','pool_lv','lv_size','segtype')}\
      \ for x in rows],key=lambda x:(x['lv_uuid'],x['segtype'],x['lv_size']))\nneed(projection==c['capacity']['lv_projection'],'fixed\
      \ volume maxima changed')\nlv=[x for x in rows if x['lv_uuid'].strip()==h['stage']['lv_uuid']];need(len(lv)==1\
      \ and lv[0]['pool_lv'].strip()==pool['lv_name'].strip() and lv[0]['vg_uuid'].strip()==pool['vg_uuid'].strip(),'stage\
      \ LV mapping')\ndevice=os.stat(c['final']['device']);need(stat.S_ISBLK(device.st_mode) and device.st_rdev==c['final']['rdev'],'expected\
      \ block identity')\nneed(os.stat(lv[0]['lv_path'].strip()).st_rdev==device.st_rdev and os.path.realpath(lv[0]['lv_path'].strip())==os.path.realpath(c['final']['device']),'LV\
      \ path and canonical block identity differ')\nneed(run([h['tools']['blkid'],'-s','UUID','-o','value',c['final']['device']]).strip()==c['final']['fs_uuid']\
      \ and run([h['tools']['blkid'],'-s','TYPE','-o','value',c['final']['device']]).strip()=='ext4','expected\
      \ filesystem identity')\nneed(run(['/usr/bin/systemd-escape','--path','--suffix=mount',c['final']['path']]).strip()==c['final']['unit']\
      \ and run(['/usr/bin/systemd-escape','--path','--suffix=mount',h['stage']['path']]).strip()==h['stage']['unit'],'mount\
      \ unit/path escaping mismatch')\nsource=pathlib.Path(c['source']['path']);rollback=pathlib.Path(c['rollback']['path']);stage=pathlib.Path(h['stage']['path']);receipt=pathlib.Path(c['receipt']['path'])\n\
      for p in (source,rollback,stage,receipt.parent):need(p.is_absolute() and str(p)==os.path.abspath(p)\
      \ and p.parent.resolve()==p.parent,'ambiguous canonical path')\nfor a,z in ((source,stage),(rollback,stage),(source,rollback)):\n\
      \ need(a!=z and a not in z.parents and z not in a.parents,'overlapping footprint')\nparent=source.parent.stat();need(parent.st_dev==c['source']['parent_dev']\
      \ and parent.st_ino==c['source']['parent_ino'] and rollback.parent==source.parent,'source parent\
      \ changed or EXDEV rollback')\nrenamed=rollback.exists()\noriginal=rollback if renamed else source\n\
      old=original.lstat();need(stat.S_ISDIR(old.st_mode) and not original.is_symlink() and old.st_dev==c['source']['dev']\
      \ and old.st_ino==c['source']['ino'],'original dev/inode changed')\nprotected=receipt.parent.lstat();need(stat.S_ISDIR(protected.st_mode)\
      \ and protected.st_uid==0 and stat.S_IMODE(protected.st_mode)==0o700 and protected.st_dev==parent.st_dev\
      \ and receipt.parent!=pathlib.Path('/etc/pve'),'stable protected rootFS receipt directory')\nfor\
      \ p in (source,rollback,stage):need(receipt.parent!=p and p not in receipt.parent.parents and receipt.parent\
      \ not in p.parents,'receipt overlaps copy/wipe footprint')\n# Existing records are inspected through\
      \ already trusted immutable helper bytes;\n# never redeclare/overwrite helpers on a completed or\
      \ interrupted attempt.\nreceipt_present=os.path.lexists(receipt)\nif receipt_present:bounded_file(receipt,c['receipt']['max_bytes'])\n\
      for kind in ('receipt','manifest'):\n helper=pathlib.Path(c['receipt'][kind+'_helper'])\n need(helper.parent==receipt.parent\
      \ and helper not in (receipt,pathlib.Path(c['receipt']['manifest_path'])),'helper path identity')\n\
      \ if os.path.lexists(helper):\n  info=helper.lstat();need(stat.S_ISREG(info.st_mode) and info.st_uid==0\
      \ and info.st_nlink==1 and stat.S_IMODE(info.st_mode)==0o600,'unowned helper')\n  raw=bounded_file(helper,c['limits']['output_bytes'])\n\
      \  need(hashlib.sha256(raw).hexdigest()==r['helper_sha256'][kind],'helper bytes differ; no overwrite')\n\
      \ else:need(not receipt_present,'missing helper for existing receipt; no deployment on resume')\n\
      receipt_present=os.path.lexists(receipt)\nread_only_resume=r['observe_only'] or (r['initial'] and\
      \ receipt_present)\nscan={'__name__':'scan','MetadataBudget':scope['MetadataBudget']};exec(r['consumers'],scan)\n\
      roots=scan['consumer_roots'](original,source,stage)\nrefs=None if read_only_resume else scan['consumer_refs'](roots,c['limits']['entries'],c['limits']['metadata_read_bytes'],c['limits']['action_seconds'],filesystem_devices=(device.st_rdev,))\n\
      metadata_total+=0;  # Shared child accessor counter includes consumer reads; do not reset/add another\
      \ allowance.\nneed(metadata_total+runner.total<=c['limits']['metadata_read_bytes'],'whole consumer\
      \ metadata cap')\nfor loop in loops:\n backing=os.stat(loop['back-file']);need((backing.st_dev,backing.st_ino)\
      \ not in getattr(scan['consumer_refs'],'footprint',set()) and backing.st_dev!=device.st_rdev,'physical\
      \ loop/backing footprint')\nneed(read_only_resume or not refs,'live original/source/stage references')\n\
      namespaces={}\nproc_names=os.listdir('/proc');need(len(proc_names)<=c['limits']['entries'],'process\
      \ enumeration cap')\nfor pid in proc_names:\n if pid.isdigit():\n  try:namespaces.setdefault(os.stat('/proc/'+pid+'/ns/mnt').st_ino,pid)\n\
      \  except FileNotFoundError:raise ValueError('raced namespace scan')\nphysical_roots=[str(path)\
      \ for path in roots]\naliases=[]\ndef overlap(a,z):return a==z or a.startswith(z.rstrip('/')+'/')\
      \ or z.startswith(a.rstrip('/')+'/')\nfor pid in namespaces.values():\n raw=bounded_file('/proc/'+pid+'/mountinfo',c['limits']['metadata_read_bytes'])\n\
      \ aliases+=scan['mount_aliases'](raw.decode().splitlines(),str(os.major(old.st_dev))+':'+str(os.minor(old.st_dev)),physical_roots,str(os.major(device.st_rdev))+':'+str(os.minor(device.st_rdev)),[str(stage),str(source)])\n\
      need(read_only_resume or not aliases,'relevant physical namespace alias')\nworkers=json.loads(run([h['tools']['pvenode'],'task','list','--source','active','--output-format','json']))\n\
      need(read_only_resume or all(x['upid'] in window['foreign_upids'] for x in workers),'predisable\
      \ relevant workers not naturally drained')\n# Static foreign disk bindings, not percentages/open\
      \ counts.\nvmids=json.loads(run([h['tools']['pvesh'],'get','/cluster/resources','--type','vm','--output-format','json']))\n\
      vm_projection={}\nfor vm in vmids:\n need(vm['type']=='qemu','unexpected CT dependency')\n conf=json.loads(run([h['tools']['pvesh'],'get','/nodes/'+c['window']['node']+'/qemu/'+str(vm['vmid'])+'/config','--output-format','json']))\n\
      \ vm_projection[str(vm['vmid'])]={k:v for k,v in conf.items() if re.fullmatch(r'(?:scsi|ide|sata|virtio|unused)[0-9]+',k)}\n\
      need(vm_projection==c['capacity']['foreign_vm_projection'],'foreign VM disk projection changed')\n\
      def active(path):\n view=json.loads(run(['/usr/bin/findmnt','--json','--target',str(path),'--output','TARGET,SOURCE,FSTYPE,UUID,MAJ:MIN,FSROOT']))['filesystems'][0]\n\
      \ if view['target']!=str(path):return False\n need(view['fstype']=='ext4' and view['uuid']==c['final']['fs_uuid']\
      \ and view['maj:min']==str(os.major(device.st_rdev))+':'+str(os.minor(device.st_rdev)) and view['fsroot']=='/','wrong\
      \ expected mount')\n return True\nstage_active=active(stage);final_active=active(source)\nif not\
      \ stage_active:\n point=stage.lstat();need(stat.S_ISDIR(point.st_mode) and not stage.is_symlink()\
      \ and point.st_dev==h['stage']['path_dev'] and point.st_ino==h['stage']['path_ino'] and not os.listdir(stage),'inactive\
      \ stage point not exact own empty directory')\nif renamed and not final_active:need(not os.listdir(source),'unmounted\
      \ final point is not empty')\nif not renamed:need(old.st_dev==parent.st_dev,'original is not same-FS\
      \ rename tree')\nneed(not(stage_active and final_active),'simultaneous stage/final alias')\nneed(run(['/usr/bin/findmnt','--noheadings','--output','UUID','--target',str(source.parent)]).strip()!=c['final']['fs_uuid'],'stage\
      \ UUID aliases original rootFS')\nversion=run([h['tools']['rsync'],'--version']);need(bool(re.search(r'rsync\\\
      s+version\\s+3\\.(?:[2-9]|1[0-9])\\.',version)) and all(x in version for x in ('ACLs','xattrs','hardlinks')),'unsupported\
      \ deterministic rsync')\nseed=c['preconditions']['seed_path']\nif not read_only_resume and (not\
      \ renamed or final_active):\n fd=os.open(seed,os.O_RDONLY|os.O_NOFOLLOW)\n try:\n  s=os.fstat(fd);need(stat.S_ISREG(s.st_mode)\
      \ and s.st_size==c['preconditions']['seed_bytes'] and s.st_size<=c['limits']['hash_bytes'],'seed\
      \ hash cap')\n  digest=hashlib.sha256();digest_bytes=0\n  while True:\n   chunk=os.read(fd,min(1048576,max(1,s.st_size-digest_bytes)))\n\
      \   if not chunk:break\n   digest_bytes+=len(chunk);need(digest_bytes<=s.st_size,'seed read overrun');digest.update(chunk)\n\
      \  need(os.fstat(fd).st_size==s.st_size and os.fstat(fd).st_mtime_ns==s.st_mtime_ns,'seed changed')\n\
      \ finally:os.close(fd)\n need(digest.hexdigest()==c['preconditions']['seed_sha256'],'protected new\
      \ seed changed')\nfinal_policy=None\nif r.get('final_policy_readback',False):\n fields=['ActiveState','UnitFileState','FragmentPath','NeedDaemonReload']\n\
      \ rows=run(['/usr/bin/systemctl','show',c['final']['unit'],'--property='+','.join(fields)]).splitlines()\n\
      \ need(len(rows)==len(fields) and len(set(x.split('=',1)[0] for x in rows))==len(fields),'complete\
      \ final boot readback')\n final_policy=dict(x.split('=',1) for x in rows);need(set(final_policy)==set(fields),'exact\
      \ final boot readback')\nresult={'consumers_measured':not read_only_resume,'final_policy':final_policy,'receipt_present':receipt_present,'helpers_verified':True,'host_id':host,'boot_id':boot,'now':now,'digest':storage['digest'],'storage':selected,'foreign':foreign,'complete':True,'refs':refs,'aliases':aliases,'workers':workers,'workers_relevant':[x\
      \ for x in workers if x['upid'] not in window['foreign_upids']],'metadata_read_bytes':metadata_total+runner.total,'native_commands':runner.commands,'seed_read_bytes':digest_bytes\
      \ if 'digest_bytes' in globals() else 0,'old_loop':False,'data_used_bytes':data_used,'metadata_used_bytes':meta_used,'healthy':True,'stage_active':stage_active,'final_active':final_active,'fs_uuid':c['final']['fs_uuid'],'device':os.path.realpath(c['final']['device']),'rdev':device.st_rdev,'mountpoint_dev':source.lstat().st_dev,'mountpoint_ino':source.lstat().st_ino,'source_renamed':renamed,'seed_sha256':c['preconditions']['seed_sha256'],'is_mountpoint_raw':selected.get('is_mountpoint'),'mountpoint_guard':storage['selected_mountpoint'],'storage_disabled':bool(storage['selected_disabled']),'original_disabled':bool(storage['original_disabled'])}\n\
      out=json.dumps(result);need(len(out.encode())<=cap,'observation output cap');print(out)"
    cutover_helper_sha256:
      receipt: '{{ lookup(''file'', playbook_dir ~ ''/../ops/host_storage_receipt.py'', rstrip=false)
        | hash(''sha256'') }}'
      manifest: '{{ lookup(''file'', playbook_dir ~ ''/../ops/host_storage_manifest.py'', rstrip=false)
        | hash(''sha256'') }}'
    cutover_command_boundary: "import ctypes,errno,hashlib,json,math,os,pathlib,selectors,signal,stat,subprocess,sys,tempfile,time\n\
      SCHEMA='qcl.storage-cutover.command.v1'\nKINDS={'clock_bootstrap','probe','mount_guard','reference_check','manifest','receipt_io','native_argv','declare_file','rename_original','restore_original'}\n\
      def need(value,message):\n if not value:raise ValueError(message)\ndef integer(v,positive=True):return\
      \ type(v) is int and v>=(1 if positive else 0)\nMETADATA_SOURCE=\"class MetadataBudget:\\n def __init__(self,allowance,deadline):\\\
      n  need(type(allowance) is int and allowance>0 and type(deadline) in (int,float) and math.isfinite(deadline),'metadata\
      \ allowance/deadline');self.limit=allowance;self.deadline=deadline;self.used=0;self.payload=0;self.accesses=0\\\
      n  self.raw=getattr(os,'_qcl_originals',{k:getattr(os,k) for k in ('open','read','close','stat','lstat','fstat','readlink','scandir','pathconf','listxattr','getxattr')})\\\
      n def content_fd(self,fd):\\n  roles=getattr(os,'_qcl_content_roles',None)\\n  if roles is not None:roles[fd]='content'\\\
      n def tick(self):need(time.monotonic()<self.deadline,'metadata deadline')\\n def reserve(self,n):self.tick();need(type(n)\
      \ is int and n>=0 and self.used+n<=self.limit,'metadata shared cap')\\n def charge(self,n):self.reserve(n);self.used+=n;self.payload+=n\\\
      n def access(self,maximum=1):self.reserve(maximum);self.used+=1;self.accesses+=1\\n def record(self,s):\\\
      n  value=json.dumps([s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_gid,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns],separators=(',',':')).encode();need(len(value)<=512,'metadata\
      \ stat native maximum');self.charge(len(value));self.tick();return s\\n def info(self,path,follow=True):\\\
      n  self.access(513);return self.record(self.raw['stat'](path,follow_symlinks=follow))\\n def fdinfo(self,fd):self.access(513);return\
      \ self.record(self.raw['fstat'](fd))\\n def read(self,path,maximum):\\n  self.tick();s=self.info(path,False);need(stat.S_ISREG(s.st_mode)\
      \ and s.st_nlink==1 and s.st_size<=maximum,'metadata identity/cap')\\n  self.access();fd=self.raw['open'](path,os.O_RDONLY|os.O_NOFOLLOW)\\\
      n  try:\\n   initial=self.fdinfo(fd);need((initial.st_dev,initial.st_ino)==(s.st_dev,s.st_ino),'metadata\
      \ open race');value=bytearray()\\n   while True:\\n    self.access();size=min(65536,maximum+1-len(value),self.limit-self.used);need(size>0,'metadata\
      \ detection allowance')\\n    self.reserve(size);chunk=self.raw['read'](fd,size);self.charge(len(chunk));self.tick()\\\
      n    if not chunk:break\\n    value.extend(chunk);need(len(value)<=maximum,'metadata read cap')\\\
      n   final=self.fdinfo(fd);need((initial.st_dev,initial.st_ino,initial.st_size,initial.st_mtime_ns,initial.st_ctime_ns)==(final.st_dev,final.st_ino,final.st_size,final.st_mtime_ns,final.st_ctime_ns),'metadata\
      \ raced');return bytes(value)\\n  finally:self.raw['close'](fd)\\n def name_max(self,path):\\n \
      \ self.access(65);value=self.raw['pathconf'](path,'PC_NAME_MAX');need(type(value) is int and 0<value<=4096,'finite\
      \ native filename maximum')\\n  raw=str(value).encode('ascii');need(len(raw)<=64,'native name maximum\
      \ projection');self.charge(len(raw));self.tick();return value\\n def names(self,path):\\n  values=[];maximum=self.name_max(path);self.access();iterator=self.raw['scandir'](path)\\\
      n  try:\\n   while True:\\n    self.access(maximum+1)\\n    try:entry=next(iterator)\\n    except\
      \ StopIteration:break\\n    raw=os.fsencode(entry.name);need(len(raw)<=maximum,'native filename\
      \ maximum exceeded');self.charge(len(raw));self.tick();values.append(entry.name)\\n  finally:iterator.close()\\\
      n  return values\\n def link(self,path,*args,**kwargs):\\n  self.access(4097);value=self.raw['readlink'](path,*args,**kwargs);need(len(os.fsencode(value))<=4096,'metadata\
      \ native link maximum');self.charge(len(os.fsencode(value)));self.tick();return value\\n\\ndef current_metadata():return\
      \ getattr(os,'_qcl_metadata_budget',None)\\ndef helper_metadata_bound(kind,request,input_bytes,load_bytes,output_bytes=0):\\\
      n action=request.get('action','snapshot');b=request.get('max_bytes',0)\\n factors={'inspect':1,'transition':4,'persist_manifest':2,'read_manifest':1,'sync_manifest':3}\\\
      n if kind=='receipt':need(action in factors and integer(b),'helper metadata action/max_bytes')\\\
      n # Four record reads plus atomic parent validation in the longest transition.\\n # Each canonical\
      \ path component can incur a link accessor (Linux <=4096 bytes).\\n # Each read has <=5 stat records\
      \ and ceil(B/65536)+1 chunk accesses.\\n # tempfile's actual finite collision bound is prepaid before\
      \ its first create.\\n components=len(pathlib.PurePosixPath(request.get('path','/')).parts)\\n tries=tempfile.TMP_MAX;need(integer(tries),'finite\
      \ native tempfile tries')\\n reads=factors.get(action,0);parents=reads+(1 if action in ('transition','persist_manifest','sync_manifest')\
      \ else 0)\\n headers=parents*(components*4097+513)+reads*(5*513+(b+65535)//65536+4)+tries+8192\\\
      n return reads*b+input_bytes+load_bytes+output_bytes+headers\\n\\ndef child_metadata_load_bound(request):\\\
      n op=request['operation'];body=len(op['argv'][2].encode()) if len(op['argv'])>=3 and op['argv'][1]=='-c'\
