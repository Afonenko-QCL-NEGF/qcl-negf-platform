            - '{{ h.tools.python }}'
            - '{{ c.receipt.manifest_helper }}'
            stdin: '{{ {''action'':''equal'', ''source'':(historical.stdout | from_json).manifest, ''destination'':manifest_restored.stdout
              | from_json} | to_json }}'
          changed_when: false
          check_mode: false
          register: comparison
        - name: Restored original content verified only while gate held
          ansible.builtin.assert:
            that:
            - (comparison.stdout | from_json).equal is sameas true
            fail_msg: 'Cutover refusal: incomplete/stale/ambiguous admission; preserve original, partial copy and
              host receipt.'
        - name: Observe restored original fixed identity before config restoration
          ansible.builtin.command:
            argv:
            - /usr/bin/timeout
            - '{{ c.limits.action_seconds | string }}'
            - '{{ h.tools.python }}'
            - -c
            - '{{ cutover_native_probe }}'
            stdin: '{{ {''h'': h, ''helper_sha256'': cutover_helper_sha256, ''observe_only'':false, ''initial'':false}
              | to_json }}'
          changed_when: false
          check_mode: false
          register: live
        - name: CAS original offline semantics while gate remains closed
          ansible.builtin.command:
            argv: '{{ [h.tools.pvesm,''set'',c.storage.id,''--digest'',(live.stdout | from_json).digest] + ([''--is_mountpoint'',c.storage.stanza.is_mountpoint
              | string] if ''is_mountpoint'' in c.storage.stanza else [''--delete'',''is_mountpoint'']) }}'
          changed_when: true
          check_mode: false
        - name: Observe restored original offline semantics and held disabled gate
          ansible.builtin.command:
            argv:
            - /usr/bin/timeout
            - '{{ c.limits.action_seconds | string }}'
            - '{{ h.tools.python }}'
            - -c
            - '{{ cutover_native_probe }}'
            stdin: '{{ {''h'': h, ''helper_sha256'': cutover_helper_sha256, ''observe_only'':false, ''initial'':false}
              | to_json }}'
          changed_when: false
          check_mode: false
          register: live
        - name: Restored original is same root tree and original offline policy
          ansible.builtin.assert:
            that:
            - not (live.stdout | from_json).source_renamed
            - not (live.stdout | from_json).final_active
            - (live.stdout | from_json).storage_disabled is sameas true
            - (live.stdout | from_json).storage.get('is_mountpoint') == c.storage.stanza.get('is_mountpoint')
            fail_msg: 'Cutover refusal: incomplete/stale/ambiguous admission; preserve original, partial copy and
              host receipt.'
        - name: Durable receipt rolled_back
          ansible.builtin.command:
            argv:
            - '{{ h.tools.python }}'
            - '{{ c.receipt.receipt_helper }}'
            stdin: '{{ {''action'':''transition'', ''path'': c.receipt.path, ''identity'':receipt_identity, ''phase'':''rolled_back'',
              ''payload'':{''original_restored'':c.source.path}, ''max_bytes'':c.receipt.max_bytes, ''expected_sha256'':receipt_current.sha256}
              | to_json }}'
          changed_when: true
          check_mode: false
          register: receipt_write
        - name: Use successful host receipt readback only
          ansible.builtin.set_fact:
            receipt_current: '{{ receipt_write.stdout | from_json }}'
        - name: Durable receipt reopening_intent
          ansible.builtin.command:
            argv:
            - '{{ h.tools.python }}'
            - '{{ c.receipt.receipt_helper }}'
            stdin: '{{ {''action'':''transition'', ''path'': c.receipt.path, ''identity'':receipt_identity, ''phase'':''reopening_intent'',
              ''payload'':{''expected_config_digest'':(live.stdout | from_json).digest,''original_storage'':c.storage.stanza},
              ''max_bytes'':c.receipt.max_bytes, ''expected_sha256'':receipt_current.sha256, ''intended_tree'':''restored_original''}
              | to_json }}'
          changed_when: true
          check_mode: false
          register: receipt_write
        - name: Use successful host receipt readback only
          ansible.builtin.set_fact:
            receipt_current: '{{ receipt_write.stdout | from_json }}'
        - name: CAS restored original gate reopen semantics once
          ansible.builtin.command:
            argv: '{{ [h.tools.pvesm,''set'',c.storage.id,''--digest'',(live.stdout | from_json).digest] + ([''--disable'',c.storage.stanza.disable
              | string] if ''disable'' in c.storage.stanza else [''--delete'',''disable'']) }}'
          changed_when: true
          check_mode: false
        - name: Observe restored original reopening fixed state only
          ansible.builtin.command:
            argv:
            - /usr/bin/timeout
            - '{{ c.limits.action_seconds | string }}'
            - '{{ h.tools.python }}'
            - -c
            - '{{ cutover_native_probe }}'
            stdin: '{{ {''h'': h, ''helper_sha256'': cutover_helper_sha256, ''observe_only'':true, ''initial'':false}
              | to_json }}'
          changed_when: false
          check_mode: false
          register: live
        - name: Original reopening observed without stale content oracle
          ansible.builtin.assert:
            that:
            - (live.stdout | from_json).storage == c.storage.stanza
            - not (live.stdout | from_json).source_renamed
            - not (live.stdout | from_json).final_active
            fail_msg: 'Cutover refusal: incomplete/stale/ambiguous admission; preserve original, partial copy and
              host receipt.'
        - name: Durable receipt reopened
          ansible.builtin.command:
            argv:
            - '{{ h.tools.python }}'
            - '{{ c.receipt.receipt_helper }}'
            stdin: '{{ {''action'':''transition'', ''path'': c.receipt.path, ''identity'':receipt_identity, ''phase'':''reopened'',
              ''payload'':{''observed_config_digest'':(live.stdout | from_json).digest}, ''max_bytes'':c.receipt.max_bytes,
              ''expected_sha256'':receipt_current.sha256} | to_json }}'
          changed_when: true
          check_mode: false
          register: receipt_write
        - name: Use successful host receipt readback only
          ansible.builtin.set_fact:
            receipt_current: '{{ receipt_write.stdout | from_json }}'
        - name: Durable receipt complete
          ansible.builtin.command:
            argv:
            - '{{ h.tools.python }}'
            - '{{ c.receipt.receipt_helper }}'
            stdin: '{{ {''action'':''transition'', ''path'': c.receipt.path, ''identity'':receipt_identity, ''phase'':''complete'',
              ''payload'':{''restored_original'':c.source.path,''protected_image_retained'':h.stage.lv_uuid}, ''max_bytes'':c.receipt.max_bytes,
              ''expected_sha256'':receipt_current.sha256} | to_json }}'
          changed_when: true
          check_mode: false
          register: receipt_write
        - name: Use successful host receipt readback only
          ansible.builtin.set_fact:
            receipt_current: '{{ receipt_write.stdout | from_json }}'
      - name: Stop named failed attempt without rollback or retry after ambiguity
        ansible.builtin.fail:
          msg: 'reconcile_required: phase={{ receipt_current.record.phase if receipt_current.record is not none
            else "missing" }}; reread host receipt and fixed native observations retained. No automatic CAS/copy/rename/start/stop/delete.
            Original and protected LV retained; coordinator must admit recovery.'
