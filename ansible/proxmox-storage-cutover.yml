- name: Opt-in retained Proxmox directory cutover only
  hosts: proxmox_hypervisors
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    h: '{{ {''apply'':false,''cutover'':{''enabled'':false}} | combine(qcl_host_storage | default({}),recursive=true)
      }}'
    c: '{{ h.cutover }}'
    cutover_native_probe: "import hashlib,json,os,pathlib,re,stat,subprocess,sys,time\nfrom decimal import Decimal,ROUND_CEILING\n\
      r=json.load(sys.stdin); h=r['h']; c=h['cutover']; start=time.monotonic(); cap=c['limits']['output_bytes']\n\
      def need(condition,message):\n if not condition: raise ValueError(message)\ndef run(argv,allowed=(0,)):\n\
      \ import selectors\n remaining=c['limits']['action_seconds']-(time.monotonic()-start)\n need(remaining>0,'probe\
      \ deadline')\n process=subprocess.Popen(argv,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=dict(os.environ,LC_ALL='C'))\n\
      \ selector=selectors.DefaultSelector();buffers={};total=0\n for pipe in (process.stdout,process.stderr):selector.register(pipe,selectors.EVENT_READ);buffers[pipe.fileno()]=bytearray()\n\
      \ try:\n  while selector.get_map():\n   remaining=c['limits']['action_seconds']-(time.monotonic()-start);need(remaining>0,'native\
      \ read deadline')\n   for key,mask in selector.select(min(remaining,1)):\n    chunk=os.read(key.fd,65536)\n\
      \    if not chunk:selector.unregister(key.fileobj);continue\n    total+=len(chunk);need(total<=cap,'native\
      \ output cap');buffers[key.fd].extend(chunk)\n  rc=process.wait(timeout=max(0.01,c['limits']['action_seconds']-(time.monotonic()-start)))\n\
      \  need(rc in allowed,'native command failed')\n  return buffers[process.stdout.fileno()].decode('utf-8')\n\
      \ finally:\n  selector.close()\n  if process.poll() is None:process.kill();process.wait()\n  process.stdout.close();process.stderr.close()\n\
      def bounded_file(path,maximum=65536):\n s=os.lstat(path);need(stat.S_ISREG(s.st_mode) and s.st_size<=maximum\
      \ and s.st_uid==0 and s.st_nlink==1,'untrusted prerequisite file')\n fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)\n\
      \ try:\n  data=os.read(fd,maximum+1);need(len(data)<=maximum,'prerequisite cap');return data\n finally:os.close(fd)\n\
      def exact_receipt(ref):\n need(type(ref)==dict and set(ref)=={'path','sha256'},'exact prerequisite receipt\
      \ reference')\n data=bounded_file(ref['path']);need(hashlib.sha256(data).hexdigest()==ref['sha256'],'prerequisite\
      \ changed')\n return json.loads(data)\nnow=int(time.time());need(now<h['admission']['expires_at_epoch'] and\
      \ now<c['window']['expires_at_epoch'],'expired admission/window')\nhost=bounded_file('/etc/machine-id').decode().strip();boot=bounded_file('/proc/sys/kernel/random/boot_id').decode().strip()\n\
      need(host==h['host_id'] and boot==h['boot_id'],'host/boot mismatch')\nwindow=exact_receipt(c['window']['reference'])\n\
      need(window['held'] is True and window['host_id']==host and window['boot_id']==boot and window['attempt_id']==h['attempt_id']\
      \ and window['owner']==c['window']['owner'] and window['expires_at_epoch']==c['window']['expires_at_epoch']\
      \ and window['scope']==c['window']['scope'],'held caller window changed')\nfor key in ('d04_receipt','r1r2_receipt','seed_receipt'):\n\
      \ prerequisite=exact_receipt(c['preconditions'][key]);need(prerequisite['accepted'] is True,'unaccepted native\
      \ prerequisite')\nneed(run(['/usr/bin/systemctl','is-active',c['preconditions']['old_installer_unit']],(0,3)).strip()\
      \ in ('inactive','failed'),'old installer still active')\nloops=json.loads(run(['/usr/sbin/losetup','--json','--list','--output','NAME,BACK-FILE']))['loopdevices']\n\
      need(all(x['back-file']!=c['preconditions']['old_installer_backing'] for x in loops),'old installer loop backing\
      \ remains')\nstorage=json.loads(run(['/usr/bin/perl','-MPVE::Storage','-MPVE::Storage::DirPlugin','-MPVE::JSONSchema','-MJSON','-e',\n\
      \ 'my $c=PVE::Storage::config(); my $s=PVE::Storage::storage_config($c,$ARGV[0]); my $o=JSON::decode_json($ARGV[1]);\
      \ $c->{selected_mountpoint}=PVE::Storage::DirPlugin::parse_is_mountpoint($s); $c->{selected_disabled}=PVE::JSONSchema::parse_boolean($s->{disable}//0);\
      \ $c->{original_disabled}=PVE::JSONSchema::parse_boolean($o->{disable}//0); print JSON::encode_json($c);',c['storage']['id'],json.dumps(c['storage']['stanza'])]))\n\
      need(type(storage['selected_disabled']) in (int,bool) and storage['selected_disabled'] in (0,1) and type(storage['original_disabled'])\
      \ in (int,bool) and storage['original_disabled'] in (0,1),'unknown native disable semantics')\nselected=storage['ids'][c['storage']['id']];foreign={k:v\
      \ for k,v in storage['ids'].items() if k!=c['storage']['id']}\nneed(foreign==c['storage']['foreign'],'foreign\
      \ storage changed')\nfixed=lambda x:{k:v for k,v in x.items() if k not in ('disable','is_mountpoint')}\nneed(fixed(selected)==fixed(c['storage']['stanza']),'selected\
      \ fixed stanza changed')\nrows=json.loads(run([h['tools']['lvs'],'--reportformat','json','--units','b','--nosuffix','-o','lv_name,vg_name,lv_uuid,vg_uuid,pool_lv,lv_size,lv_metadata_size,data_percent,metadata_percent,lv_health_status,segtype,lv_path']))['report'][0]['lv']\n\
      pool=[x for x in rows if x['lv_uuid'].strip()==c['capacity']['pool_uuid']];need(len(pool)==1,'pool identity\
      \ unknown');pool=pool[0]\nfor field in ('data_percent','metadata_percent'):\n value=pool[field].strip();need(bool(re.fullmatch(r'(?:[0-9]+(?:\\\
      .[0-9]+)?|\\.[0-9]+)',value)) and 0<=float(value)<=100,'unknown pool usage')\nneed(pool['lv_health_status'].strip()=='','pool\
      \ unhealthy')\nfor f in ('lv_size','lv_metadata_size'):need(bool(re.fullmatch(r'[0-9]+(?:\\.0+)?',pool[f].strip())),'unknown\
      \ physical pool size')\ndata=int(Decimal(pool['lv_size'].strip()));metadata=int(Decimal(pool['lv_metadata_size'].strip()))\n\
      need(data==c['capacity']['data_bytes'] and metadata==c['capacity']['metadata_bytes'],'pool fixed bounds changed')\n\
      data_used=int((Decimal(data)*Decimal(pool['data_percent'].strip())/100).to_integral_value(rounding=ROUND_CEILING));meta_used=int((Decimal(metadata)*Decimal(pool['metadata_percent'].strip())/100).to_integral_value(rounding=ROUND_CEILING))\n\
      need(data_used+c['capacity']['growth_bytes']+c['capacity']['image_envelope_bytes']+c['capacity']['data_reserve_bytes']<=data,'thin\
      \ data bound')\nneed(meta_used+c['capacity']['metadata_growth_bytes']+c['capacity']['metadata_reserve_bytes']<=metadata,'thin\
      \ metadata bound')\nprojection=sorted([{k:x[k].strip() for k in ('lv_uuid','vg_uuid','pool_lv','lv_size','segtype')}\
      \ for x in rows],key=lambda x:(x['lv_uuid'],x['segtype'],x['lv_size']))\nneed(projection==c['capacity']['lv_projection'],'fixed\
      \ volume maxima changed')\nlv=[x for x in rows if x['lv_uuid'].strip()==h['stage']['lv_uuid']];need(len(lv)==1\
      \ and lv[0]['pool_lv'].strip()==pool['lv_name'].strip() and lv[0]['vg_uuid'].strip()==pool['vg_uuid'].strip(),'stage\
      \ LV mapping')\ndevice=os.stat(c['final']['device']);need(stat.S_ISBLK(device.st_mode) and device.st_rdev==c['final']['rdev'],'expected\
      \ block identity')\nneed(os.stat(lv[0]['lv_path'].strip()).st_rdev==device.st_rdev and os.path.realpath(lv[0]['lv_path'].strip())==os.path.realpath(c['final']['device']),'LV\
      \ path and canonical block identity differ')\nneed(run([h['tools']['blkid'],'-s','UUID','-o','value',c['final']['device']]).strip()==c['final']['fs_uuid']\
      \ and run([h['tools']['blkid'],'-s','TYPE','-o','value',c['final']['device']]).strip()=='ext4','expected filesystem\
      \ identity')\nneed(run(['/usr/bin/systemd-escape','--path','--suffix=mount',c['final']['path']]).strip()==c['final']['unit']\
      \ and run(['/usr/bin/systemd-escape','--path','--suffix=mount',h['stage']['path']]).strip()==h['stage']['unit'],'mount\
      \ unit/path escaping mismatch')\nsource=pathlib.Path(c['source']['path']);rollback=pathlib.Path(c['rollback']['path']);stage=pathlib.Path(h['stage']['path']);receipt=pathlib.Path(c['receipt']['path'])\n\
      for p in (source,rollback,stage,receipt.parent):need(p.is_absolute() and str(p)==os.path.abspath(p) and p.parent.resolve()==p.parent,'ambiguous\
      \ canonical path')\nfor a,z in ((source,stage),(rollback,stage),(source,rollback)):\n need(a!=z and a not\
      \ in z.parents and z not in a.parents,'overlapping footprint')\nparent=source.parent.stat();need(parent.st_dev==c['source']['parent_dev']\
      \ and parent.st_ino==c['source']['parent_ino'] and rollback.parent==source.parent,'source parent changed or\
      \ EXDEV rollback')\nrenamed=rollback.exists()\noriginal=rollback if renamed else source\nold=original.lstat();need(stat.S_ISDIR(old.st_mode)\
      \ and not original.is_symlink() and old.st_dev==c['source']['dev'] and old.st_ino==c['source']['ino'],'original\
      \ dev/inode changed')\nprotected=receipt.parent.lstat();need(stat.S_ISDIR(protected.st_mode) and protected.st_uid==0\
      \ and stat.S_IMODE(protected.st_mode)==0o700 and protected.st_dev==parent.st_dev and receipt.parent!=pathlib.Path('/etc/pve'),'stable\
      \ protected rootFS receipt directory')\nfor p in (source,rollback,stage):need(receipt.parent!=p and p not\
      \ in receipt.parent.parents and receipt.parent not in p.parents,'receipt overlaps copy/wipe footprint')\n\
      # Existing records are inspected through already trusted immutable helper bytes;\n# never redeclare/overwrite\
      \ helpers on a completed or interrupted attempt.\nreceipt_present=os.path.lexists(receipt)\nif receipt_present:bounded_file(receipt,c['receipt']['max_bytes'])\n\
      for kind in ('receipt','manifest'):\n helper=pathlib.Path(c['receipt'][kind+'_helper'])\n need(helper.parent==receipt.parent\
      \ and helper not in (receipt,pathlib.Path(c['receipt']['manifest_path'])),'helper path identity')\n if os.path.lexists(helper):\n\
      \  info=helper.lstat();need(stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1 and stat.S_IMODE(info.st_mode)==0o600,'unowned\
      \ helper')\n  raw=bounded_file(helper,c['limits']['output_bytes'])\n  need(hashlib.sha256(raw).hexdigest()==r['helper_sha256'][kind],'helper\
      \ bytes differ; no overwrite')\n else:need(not receipt_present,'missing helper for existing receipt; no deployment\
      \ on resume')\n# Independent per-namespace physical footprint observations; unrelated PrivateTmp passes.\n\
      namespaces={};refs=[];inodes=set();count=0\npending=[original]\nwhile pending:\n p=pending.pop();info=p.lstat();inodes.add((info.st_dev,info.st_ino));count+=1;need(count<=c['limits']['entries'],'reference\
      \ topology cap')\n if stat.S_ISDIR(info.st_mode):\n  with os.scandir(p) as children:\n   for child in children:\n\
      \    pending.append(pathlib.Path(child.path));need(count+len(pending)<=c['limits']['entries'],'reference enumeration\
      \ cap')\n need(time.monotonic()-start<c['limits']['action_seconds'],'reference deadline')\nsource_root='/'+str(original).lstrip('/')\n\
      receipt_present=os.path.lexists(receipt)\nread_only_resume=r['observe_only'] or (r['initial'] and receipt_present)\n\
      if read_only_resume and receipt_present:\n prior=json.loads(bounded_file(receipt,c['receipt']['max_bytes']))\n\
      \ need(prior.get('identity',{}).get('attempt_id')==h['attempt_id'] and prior.get('identity',{}).get('fs_uuid')==c['final']['fs_uuid'],'untrusted\
      \ existing receipt identity')\nfor pid in os.listdir('/proc'):\n if not pid.isdigit() or int(pid)==os.getpid():continue\n\
      \ proc='/proc/'+pid\n try:\n  ns=os.stat(proc+'/ns/mnt').st_ino;namespaces.setdefault(ns,pid)\n  candidates=[proc+'/cwd',proc+'/root']+[proc+'/fd/'+f\
      \ for f in os.listdir(proc+'/fd')]+[proc+'/map_files/'+f for f in os.listdir(proc+'/map_files')]\n  for p\
      \ in candidates:\n   info=os.stat(p);target=os.readlink(p).removesuffix(' (deleted)')\n   if (info.st_dev,info.st_ino)\
      \ in inodes or target==str(original) or target.startswith(str(original)+'/') or (stat.S_ISREG(info.st_mode)\
      \ and info.st_dev==device.st_rdev):refs.append({'pid':pid,'path':p,'target':target})\n except FileNotFoundError:raise\
      \ ValueError('process changed during complete scan')\n except PermissionError:raise ValueError('inaccessible\
      \ process references')\nfor loop in loops:\n backing=loop.get('back-file')\n if backing and os.path.exists(backing):\n\
      \  info=os.stat(backing)\n  if (info.st_dev,info.st_ino) in inodes or backing==str(original) or backing.startswith(str(original)+'/')\
      \ or backing.startswith(str(stage)+'/'):refs.append({'loop':loop['name'],'backing':backing})\nneed(read_only_resume\
      \ or not refs,'live original/stage references')\naliases=[]\ndef overlap(a,z):return a==z or a.startswith(z.rstrip('/')+'/')\
      \ or z.startswith(a.rstrip('/')+'/')\nfor pid in namespaces.values():\n with open('/proc/'+pid+'/mountinfo')\
      \ as f:lines=f.readlines()\n need(sum(len(x) for x in lines)<=cap,'namespace output cap')\n for line in lines:\n\
      \  fields=line.split();need(len(fields)>=10 and '-' in fields,'unknown mountinfo')\n  root,target=fields[3],fields[4];dev=fields[2]\n\
      \  if chr(92) in root or chr(92) in target:raise ValueError('unparsed escaped mount footprint')\n  if dev==str(os.major(old.st_dev))+':'+str(os.minor(old.st_dev))\
      \ and overlap(root,source_root) and not(root=='/' and target=='/'):\n   aliases.append({'pid':pid,'target':target,'root':root})\n\
      \  if dev==str(os.major(device.st_rdev))+':'+str(os.minor(device.st_rdev)) and not(root=='/' and target in\
      \ (str(stage),str(source))):aliases.append({'pid':pid,'target':target,'root':root})\nneed(read_only_resume\
      \ or not aliases,'relevant physical namespace alias')\nworkers=json.loads(run([h['tools']['pvenode'],'task','list','--source','active','--output-format','json']))\n\
      need(read_only_resume or all(x['upid'] in window['foreign_upids'] for x in workers),'predisable relevant workers\
      \ not naturally drained')\n# Static foreign disk bindings, not percentages/open counts.\nvmids=json.loads(run([h['tools']['pvesh'],'get','/cluster/resources','--type','vm','--output-format','json']))\n\
      vm_projection={}\nfor vm in vmids:\n need(vm['type']=='qemu','unexpected CT dependency')\n conf=json.loads(run([h['tools']['pvesh'],'get','/nodes/'+c['window']['node']+'/qemu/'+str(vm['vmid'])+'/config','--output-format','json']))\n\
      \ vm_projection[str(vm['vmid'])]={k:v for k,v in conf.items() if re.fullmatch(r'(?:scsi|ide|sata|virtio|unused)[0-9]+',k)}\n\
      need(vm_projection==c['capacity']['foreign_vm_projection'],'foreign VM disk projection changed')\ndef active(path):\n\
      \ view=json.loads(run(['/usr/bin/findmnt','--json','--target',str(path),'--output','TARGET,SOURCE,FSTYPE,UUID,MAJ:MIN,FSROOT']))['filesystems'][0]\n\
      \ if view['target']!=str(path):return False\n need(view['fstype']=='ext4' and view['uuid']==c['final']['fs_uuid']\
      \ and view['maj:min']==str(os.major(device.st_rdev))+':'+str(os.minor(device.st_rdev)) and view['fsroot']=='/','wrong\
      \ expected mount')\n return True\nstage_active=active(stage);final_active=active(source)\nif not stage_active:\n\
      \ point=stage.lstat();need(stat.S_ISDIR(point.st_mode) and not stage.is_symlink() and point.st_dev==h['stage']['path_dev']\
      \ and point.st_ino==h['stage']['path_ino'] and not os.listdir(stage),'inactive stage point not exact own empty\
      \ directory')\nif not renamed:need(old.st_dev==parent.st_dev,'original is not same-FS rename tree')\nneed(not(stage_active\
      \ and final_active),'simultaneous stage/final alias')\nneed(run(['/usr/bin/findmnt','--noheadings','--output','UUID','--target',str(source.parent)]).strip()!=c['final']['fs_uuid'],'stage\
      \ UUID aliases original rootFS')\nversion=run([h['tools']['rsync'],'--version']);need(bool(re.search(r'rsync\\\
      s+version\\s+3\\.(?:[2-9]|1[0-9])\\.',version)) and all(x in version for x in ('ACLs','xattrs','hardlinks')),'unsupported\
      \ deterministic rsync')\nseed=c['preconditions']['seed_path']\nif not read_only_resume and (not renamed or\
      \ final_active):\n fd=os.open(seed,os.O_RDONLY|os.O_NOFOLLOW)\n try:\n  s=os.fstat(fd);need(stat.S_ISREG(s.st_mode)\
      \ and s.st_size<=c['limits']['hash_bytes'],'seed hash cap')\n  digest=hashlib.sha256()\n  while True:\n  \
      \ chunk=os.read(fd,1048576)\n   if not chunk:break\n   digest.update(chunk)\n  need(os.fstat(fd).st_size==s.st_size\
      \ and os.fstat(fd).st_mtime_ns==s.st_mtime_ns,'seed changed')\n finally:os.close(fd)\n need(digest.hexdigest()==c['preconditions']['seed_sha256'],'protected\
      \ new seed changed')\nresult={'receipt_present':receipt_present,'helpers_verified':True,'host_id':host,'boot_id':boot,'now':now,'digest':storage['digest'],'storage':selected,'foreign':foreign,'complete':True,'refs':refs,'aliases':aliases,'workers':workers,'workers_relevant':[x\
      \ for x in workers if x['upid'] not in window['foreign_upids']],'old_loop':False,'data_used_bytes':data_used,'metadata_used_bytes':meta_used,'healthy':True,'stage_active':stage_active,'final_active':final_active,'fs_uuid':c['final']['fs_uuid'],'device':os.path.realpath(c['final']['device']),'rdev':device.st_rdev,'mountpoint_dev':source.lstat().st_dev,'mountpoint_ino':source.lstat().st_ino,'source_renamed':renamed,'seed_sha256':c['preconditions']['seed_sha256'],'is_mountpoint_raw':selected.get('is_mountpoint'),'mountpoint_guard':storage['selected_mountpoint'],'storage_disabled':bool(storage['selected_disabled']),'original_disabled':bool(storage['original_disabled'])}\n\
      out=json.dumps(result);need(len(out.encode())<=cap,'observation output cap');print(out)"
    cutover_helper_sha256:
      receipt: '{{ lookup(''file'', playbook_dir ~ ''/../ops/host_storage_receipt.py'', rstrip=false) | hash(''sha256'')
        }}'
      manifest: '{{ lookup(''file'', playbook_dir ~ ''/../ops/host_storage_manifest.py'', rstrip=false) | hash(''sha256'')
        }}'
  tasks:
  - name: Strict cutover defaults
    ansible.builtin.assert:
      that:
      - h.apply is boolean
      - c.enabled is boolean
      - not c.enabled or h.apply
      fail_msg: 'Cutover refusal: incomplete/stale/ambiguous admission; preserve original, partial copy and host
        receipt.'
  - name: One admitted bounded native cutover packet
    when: c.enabled and h.apply and not ansible_check_mode
    block:
    - name: Typed immutable bounds and prerequisite identities
      ansible.builtin.assert:
        that:
        - h.admission.fresh is sameas true
        - h.admission.exclusive is sameas true
        - h.admission.receipt is string
        - h.admission.receipt | length > 0
        - h.admission.expires_at_epoch is integer
        - h.admission.expires_at_epoch is not boolean
        - c.window.expires_at_epoch is integer
        - c.window.expires_at_epoch is not boolean
        - c.window.owner is string
        - c.window.owner | length > 0
        - c.window.receipt is string
        - c.window.receipt | length > 0
        - c.window.scope | sort == ['automation','cached-workers','direct-paths','file-content','hooks','vm-transitions']
        - c.storage.type == 'dir'
        - c.storage.path == c.source.path
        - c.storage.stanza.type == 'dir'
        - c.storage.stanza.path == c.source.path
        - c.storage.digest is match('^[0-9a-f]{40}$')
        - c.source_ref is match('^[0-9a-f]{40}$')
        - c.final.fs_uuid is match('^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
        - c.final.fs_uuid != '00000000-0000-0000-0000-000000000000'
        - c.final.fs_uuid == h.stage.fs_uuid
        - h.stage.lv_uuid is string
        - h.stage.lv_uuid | length > 0
        - h.stage.lifetime == 'protected-host-infrastructure'
        - c.final.path == c.source.path
        - c.final.options == 'rw,nodev,nosuid'
        - c.final.install_target == 'local-fs.target'
        - c.final.allowed_defaults | difference(['relatime','data=ordered']) | length == 0
        - c.final.rdev is integer
        - c.final.rdev is not boolean
        - c.final.rdev > 0
        - c.final.rdev != c.source.dev
        - c.storage.foreign is mapping
        - c.capacity.foreign_vm_projection is mapping
        - c.capacity.lv_projection is sequence
        - c.capacity.lv_projection | length > 0
        - c.window.reference is mapping
        - c.window.node is string
        - h.tools.python is match('^/usr/bin/python3$')
        - h.tools.rsync is match('^/usr/bin/rsync$')
        - h.tools.pvesm is match('^/usr/sbin/pvesm$')
        - h.tools.lvs is match('^/(usr/)?sbin/lvs$')
        - h.tools.blkid is match('^/(usr/)?sbin/blkid$')
        - h.tools.pvenode is match('^/usr/(sbin|bin)/pvenode$')
        - h.tools.pvesh is match('^/usr/(sbin|bin)/pvesh$')
        - c.limits.entries is integer
        - c.limits.entries is not boolean
        - c.limits.entries > 0
        - c.limits.hash_bytes is integer
        - c.limits.hash_bytes is not boolean
        - c.limits.hash_bytes > 0
        - c.limits.logical_bytes is integer
        - c.limits.logical_bytes is not boolean
        - c.limits.logical_bytes > 0
        - c.limits.allocated_bytes is integer
        - c.limits.allocated_bytes is not boolean
        - c.limits.allocated_bytes > 0
        - c.limits.output_bytes is integer
        - c.limits.output_bytes is not boolean
        - c.limits.output_bytes > 0
        - c.limits.seconds is integer
        - c.limits.seconds is not boolean
        - c.limits.seconds > 0
        - c.limits.copy_bytes is integer
        - c.limits.copy_bytes is not boolean
        - c.limits.copy_bytes > 0
        - c.limits.aggregate_bytes is integer
        - c.limits.aggregate_bytes is not boolean
        - c.limits.aggregate_bytes > 0
        - c.limits.action_seconds is integer
        - c.limits.action_seconds is not boolean
        - c.limits.action_seconds > 0
        - c.capacity.data_bytes is integer
        - c.capacity.data_bytes is not boolean
        - c.capacity.data_bytes > 0
        - c.capacity.metadata_bytes is integer
        - c.capacity.metadata_bytes is not boolean
        - c.capacity.metadata_bytes > 0
        - c.capacity.data_reserve_bytes is integer
        - c.capacity.data_reserve_bytes is not boolean
        - c.capacity.data_reserve_bytes > 0
        - c.capacity.metadata_reserve_bytes is integer
        - c.capacity.metadata_reserve_bytes is not boolean
        - c.capacity.metadata_reserve_bytes > 0
        - c.capacity.growth_bytes is integer
        - c.capacity.growth_bytes is not boolean
        - c.capacity.growth_bytes > 0
        - c.capacity.metadata_growth_bytes is integer
        - c.capacity.metadata_growth_bytes is not boolean
        - c.capacity.metadata_growth_bytes > 0
        - c.capacity.image_envelope_bytes is integer
        - c.capacity.image_envelope_bytes is not boolean
        - c.capacity.image_envelope_bytes > 0
        - c.source.dev is integer
        - c.source.dev is not boolean
        - c.source.dev > 0
        - c.source.ino is integer
        - c.source.ino is not boolean
        - c.source.ino > 0
        - c.source.parent_dev is integer
