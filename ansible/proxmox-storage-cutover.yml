      \ start=time.monotonic();known=set();prefix=[str(p) for p in roots];pending=list(roots);count=0;read=0\n def\
      \ tick():\n  if time.monotonic()-start>=seconds:raise ValueError('consumer deadline')\n def relevant(path):\n\
      \  return any(path==root or path.startswith(root.rstrip('/')+'/') for root in prefix)\n while pending:\n \
      \ tick();p=pending.pop()\n  try:s=p.lstat()\n  except FileNotFoundError:continue\n  known.add((s.st_dev,s.st_ino));count+=1\n\
      \  if count>entries:raise ValueError('consumer entries')\n  if stat.S_ISDIR(s.st_mode):\n   with os.scandir(p)\
      \ as children:\n    for child in children:\n     pending.append(pathlib.Path(child.path))\n     if count+len(pending)>entries:raise\
      \ ValueError('consumer enumeration')\n refs=[]\n for pid in (pids if pids is not None else [int(x) for x in\
      \ os.listdir('/proc') if x.isdigit() and int(x)!=os.getpid()]):\n  tick();proc='/proc/'+str(pid)\n  try:candidates=[proc+'/cwd',proc+'/root']+[proc+'/fd/'+x\
      \ for x in os.listdir(proc+'/fd')]+[proc+'/map_files/'+x for x in os.listdir(proc+'/map_files')]\n  except\
      \ FileNotFoundError:continue\n  for path in candidates:\n   tick()\n   try:\n    text=os.readlink(path);read+=len(text.encode())\n\
      \    if read>metadata_bytes:raise ValueError('consumer metadata cap')\n    try:s=os.stat(path)\n    except\
      \ FileNotFoundError:\n     if text.endswith(' (deleted)') and relevant(text[:-10]):refs.append({'pid':pid,'target':text,'deleted':True})\n\
      \     continue\n    if (s.st_dev,s.st_ino) in known or s.st_dev in filesystem_devices or relevant(text.removesuffix('\
      \ (deleted)')):refs.append({'pid':pid,'target':text,'dev':s.st_dev,'ino':s.st_ino})\n   except FileNotFoundError:continue\n\
      \ consumer_refs.footprint=known\n consumer_refs.read_bytes=read\n return refs\n\ndef mount_aliases(lines,root_device,roots,image_device,expected):\n\
      \ result=[]\n def overlaps(a,z):return a==z or a.startswith(z.rstrip('/')+'/') or z.startswith(a.rstrip('/')+'/')\n\
      \ for line in lines:\n  fields=line.split()\n  if len(fields)<10 or '-' not in fields:raise ValueError('mountinfo\
      \ schema')\n  device,root,target=fields[2:5]\n  if '\\\\' in root or '\\\\' in target:raise ValueError('unparsed\
