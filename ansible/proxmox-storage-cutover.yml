              stdin: '{{ {''schema'':''qcl.storage-cutover.command.v1'',''identity'':{''host_id'':h.host_id,''boot_id'':h.boot_id,''attempt_id'':h.attempt_id},''slot_id'':''action-82'',''clock'':cutover_clock,''bounds'':{''request_bytes'':c.limits.request_bytes,''output_bytes'':c.limits.output_bytes,''metadata_read_bytes'':c.limits.metadata_read_bytes,''native_commands'':c.limits.native_commands,''hash_read_bytes'':(c.limits.hash_bytes
                if cutover_operation.kind == ''manifest'' else c.preconditions.seed_bytes if cutover_operation.kind
                == ''probe'' else c.limits.reference_hash_bytes if cutover_operation.kind == ''reference_check''
                else 0),''copy_read_bytes'':(4*c.limits.copy_bytes if cutover_operation.argv | select(''equalto'',h.tools.rsync)
                | list | length else 0),''copy_write_bytes'':(2*c.limits.copy_bytes if cutover_operation.argv
                | select(''equalto'',h.tools.rsync) | list | length else 0)},''operation'':cutover_operation}
                | to_json }}'
          - name: Require complete own cleanup action-82
            ansible.builtin.assert:
              that:
              - (boundary_action_82.stdout | from_json).status == 'ok'
              - (boundary_action_82.stdout | from_json).cleanup.group_absent is sameas true
              - (boundary_action_82.stdout | from_json).cleanup.reaped is sameas true
              - (boundary_action_82.stdout | from_json).clock == cutover_clock
          - name: Decode primitive native result action-82
            ansible.builtin.set_fact:
              receipt_write: '{{ boundary_action_82 | combine({"stdout":(boundary_action_82.stdout | from_json).stdout})
                }}'
        - name: Use successful host receipt readback only
          ansible.builtin.set_fact:
            receipt_current: '{{ receipt_write.stdout | from_json }}'
      - name: Stop named failed attempt without rollback or retry after ambiguity
        ansible.builtin.fail:
          msg: 'reconcile_required: phase={{ receipt_current.record.phase if receipt_current.record is
            not none else "missing" }}; reread host receipt and fixed native observations retained. No
            automatic CAS/copy/rename/start/stop/delete. Original and protected LV retained; coordinator
            must admit recovery.'
