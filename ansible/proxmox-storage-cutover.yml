          - (admission_live.stdout | from_json).metadata_used_bytes is not boolean
          - (admission_live.stdout | from_json).data_used_bytes >= 0
          - (admission_live.stdout | from_json).metadata_used_bytes >= 0
          - (admission_live.stdout | from_json).data_used_bytes + c.capacity.growth_bytes + c.capacity.image_envelope_bytes
