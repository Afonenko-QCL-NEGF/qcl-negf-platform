- name: Verify exact loaded mount policy
  ansible.builtin.command:
    argv:
    - /usr/bin/timeout
    - '{{ c.limits.action_seconds | string }}'
    - '{{ h.tools.python }}'
    - -c
    - "import json,os,stat,subprocess,sys\nr=json.load(sys.stdin)\ndef run(argv):\n import selectors,time\n process=subprocess.Popen(argv,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=dict(os.environ,LC_ALL='C'))\n\
      \ selector=selectors.DefaultSelector();buffers={};total=0;deadline=time.monotonic()+r['seconds']\n for pipe\
      \ in (process.stdout,process.stderr):selector.register(pipe,selectors.EVENT_READ);buffers[pipe.fileno()]=bytearray()\n\
      \ try:\n  while selector.get_map():\n   remaining=deadline-time.monotonic()\n   if remaining<=0:raise ValueError('mount\
      \ guard deadline')\n   for key,mask in selector.select(min(remaining,1)):\n    chunk=os.read(key.fd,65536)\n\
      \    if not chunk:selector.unregister(key.fileobj);continue\n    total+=len(chunk)\n    if total>r['output_bytes']:raise\
      \ ValueError('mount guard output cap')\n    buffers[key.fd].extend(chunk)\n  if process.wait(timeout=max(0.01,deadline-time.monotonic()))!=0:raise\
      \ ValueError('mount guard native failure')\n  return buffers[process.stdout.fileno()].decode('utf-8')\n finally:\n\
      \  selector.close()\n  if process.poll() is None:process.kill();process.wait()\n  process.stdout.close();process.stderr.close()\n\
      unit=r['unit']; fragment='/etc/systemd/system/'+unit\nif not os.path.lexists(fragment):\n if not r['allow_absent']:\
      \ raise ValueError('missing owned fragment')\n properties=run(['/usr/bin/systemctl','show',unit,'--property=LoadState,ActiveState,FragmentPath,DropInPaths']).splitlines()\n\
      \ p=dict(x.split('=',1) for x in properties if '=' in x)\n if p.get('LoadState')!='not-found' or p.get('ActiveState')!='inactive'\
      \ or p.get('FragmentPath') or p.get('DropInPaths'): raise ValueError('unknown preexisting unit')\n print(json.dumps({'absent':True,'fragment_exact':True}));sys.exit(0)\n\
      s=os.lstat(fragment)\nif not stat.S_ISREG(s.st_mode) or s.st_uid!=0 or s.st_nlink!=1 or stat.S_IMODE(s.st_mode)!=0o644\
      \ or s.st_size>r['output_bytes']: raise ValueError('unowned/ambiguous fragment')\nwith open(fragment) as handle:\n\
      \ if handle.read(r['output_bytes']+1)!=r['expected_fragment']: raise ValueError('fragment differs')\nfields=['FragmentPath','What','Where','Type','Options','DropInPaths','NeedDaemonReload','ForceUnmount','LazyUnmount','ActiveState','UnitFileState']\n\
      rows=run(['/usr/bin/systemctl','show',unit,'--property='+','.join(fields)]).splitlines()\nif len(rows)!=len(fields)\
      \ or len(set(x.split('=',1)[0] for x in rows))!=len(fields): raise ValueError('incomplete loaded unit')\n\
      p=dict(x.split('=',1) for x in rows)\nif p['FragmentPath']!=fragment or p['Where']!=r['path'] or p['Type']!='ext4'\
      \ or p['DropInPaths'] or p['NeedDaemonReload']!='no' or p['ForceUnmount']!='no' or p['LazyUnmount']!='no':\
      \ raise ValueError('unsafe loaded mount policy')\nopts=p['Options'].split(',')\nif not {'rw','nodev','nosuid'}<=set(opts)\
      \ or set(opts)-{'rw','nodev','nosuid'}-set(r['allowed_defaults']) or {'ro','dev','suid'}&set(opts) or len(set(opts))!=len(opts):\
      \ raise ValueError('unknown/conflicting loaded options')\nwhat=p['What']\nif what.startswith('UUID='): what='/dev/disk/by-uuid/'+what[5:]\n\
      dev=os.stat(what); expected=os.stat(r['device'])\nif not stat.S_ISBLK(dev.st_mode) or not stat.S_ISBLK(expected.st_mode)\
      \ or dev.st_rdev!=r['rdev'] or expected.st_rdev!=r['rdev'] or os.path.realpath(what)!=os.path.realpath(r['device']):\
      \ raise ValueError('loaded device identity differs')\nif run(['/usr/sbin/blkid','-s','UUID','-o','value',what]).strip()!=r['fs_uuid']\
      \ or run(['/usr/sbin/blkid','-s','TYPE','-o','value',what]).strip()!='ext4': raise ValueError('loaded filesystem\
      \ identity differs')\nif r['stage']:\n if p['UnitFileState'] not in ('static','disabled') or '[Install]' in\
      \ r['expected_fragment'] or 'WantedBy=' in r['expected_fragment']: raise ValueError('stage must remain nonboot')\n\
      \ for root,dirs,files in os.walk('/etc/systemd/system',followlinks=False):\n  for name in files:\n   path=os.path.join(root,name)\n\
      \   if name==unit and os.path.islink(path): raise ValueError('stage enable link')\np.update(absent=False,fragment_exact=True,fs_uuid=r['fs_uuid'],rdev=dev.st_rdev,device=os.path.realpath(what))\n\
      print(json.dumps(p))"
    stdin: '{{ {''unit'': guard_unit, ''path'': guard_path, ''device'': c.final.device, ''rdev'': c.final.rdev,
      ''fs_uuid'': c.final.fs_uuid, ''allowed_defaults'': c.final.allowed_defaults, ''expected_fragment'': guard_fragment,
      ''allow_absent'': guard_absent, ''stage'': guard_stage, ''seconds'': c.limits.action_seconds, ''output_bytes'':
      c.limits.output_bytes} | to_json }}'
  register: mount_guard
  changed_when: false
  check_mode: false
- name: Accept only complete safe loaded policy observation
  ansible.builtin.assert:
    that:
    - (mount_guard.stdout | from_json).fragment_exact is sameas true
    - (mount_guard.stdout | from_json).get('absent', false) or (mount_guard.stdout | from_json).fs_uuid == c.final.fs_uuid
    - (mount_guard.stdout | from_json).get('absent', false) or (mount_guard.stdout | from_json).rdev == c.final.rdev
    - (mount_guard.stdout | from_json).get('absent', false) or (mount_guard.stdout | from_json).Where == guard_path
    - (mount_guard.stdout | from_json).get('absent', false) or (mount_guard.stdout | from_json).Type == 'ext4'
    - (mount_guard.stdout | from_json).get('ForceUnmount', 'no') == 'no'
    - (mount_guard.stdout | from_json).get('LazyUnmount', 'no') == 'no'
    - (mount_guard.stdout | from_json).get('DropInPaths', '') == ''
    - (mount_guard.stdout | from_json).get('NeedDaemonReload', 'no') == 'no'
    - not (['ro','dev','suid'] | intersect((mount_guard.stdout | from_json).get('Options', 'rw,nodev,nosuid').split(',')))
    - (['rw','nodev','nosuid'] | difference((mount_guard.stdout | from_json).get('Options', 'rw,nodev,nosuid').split(',')))
      | length == 0
    - ((mount_guard.stdout | from_json).get('Options', 'rw,nodev,nosuid').split(',') | difference(['rw','nodev','nosuid']
      + c.final.allowed_defaults)) | length == 0
    fail_msg: 'Cutover refusal: unsafe or unknown loaded unit; no rewrite/start/stop.'
